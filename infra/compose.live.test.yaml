# Isolated real-SFU integration profile. Use only through scripts/check_live_sfu.sh and
# scripts/check_live_ui.sh. Test browsers join the SFU's media network for ICE, as a person's
# browser reaches the published ICE ports; like that browser, they cannot reach the SFU's
# signaling port and signal through the API's /media gate at the public origin (#128).
services:
  api:
    environment:
      NODE_ENV: development
      FLUX_LIVEKIT_ALLOW_INSECURE_LOCAL: "true"
  livekit:
    # Test clients share the Compose network with LiveKit, so its private Docker
    # interface is the ICE address. Production uses an operator-owned public IP.
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        keys:
          "${FLUX_LIVEKIT_API_KEY:?Set a disposable test key}": "${FLUX_LIVEKIT_API_SECRET:?Set a disposable test secret}"
        webhook:
          api_key: "${FLUX_LIVEKIT_API_KEY:?Set a disposable test key}"
          urls:
            - http://api:8080/api/v1/internal/livekit/webhook
        room:
          auto_create: false
          max_participants: 16
          empty_timeout: 420
          departure_timeout: 180
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
  live-sfu-test:
    profiles: ["live-test"]
    build:
      context: ..
      dockerfile: infra/live-sfu-tests.Dockerfile
      args:
        E2E_IMAGE: flux-e2e:${FLUX_IMAGE_TAG:?Set an isolated image tag}
    image: flux-live-sfu-test:${FLUX_IMAGE_TAG:?Set an isolated image tag}
    # One file at a time: each binds the public origin's loopback port for its browsers.
    command: ["node_modules/.bin/tsx", "--test", "--test-concurrency=1", "tests/app/e2e/live-sfu-revocation.e2e.ts", "tests/app/e2e/live-sfu-signout.e2e.ts"]
    environment:
      FLUX_API_URL: http://api:8080
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set a loopback test origin}
      # Used only to prove the SFU's signaling port is unreachable from the browser network.
      FLUX_LIVEKIT_DIRECT_URL: ws://livekit:7880
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks: [default, livekit-media]
  # Cutover check only (#128): stands in for a participant that joined the SFU directly with a
  # pre-#128 grant before the API was upgraded. It therefore reaches the private signal network
  # and holds the SFU keys; the browser-network checks above run without either.
  live-sfu-legacy-test:
    profiles: ["live-test"]
    image: flux-live-sfu-test:${FLUX_IMAGE_TAG:?Set an isolated image tag}
    command: ["node_modules/.bin/tsx", "--test", "tests/app/e2e/live-sfu-legacy.e2e.ts"]
    environment:
      FLUX_API_URL: http://api:8080
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set a loopback test origin}
      # The alias exists only on livekit-signal; `livekit` resolves to the media network first.
      FLUX_LIVEKIT_PRIVATE_URL: ws://livekit-signal-bind:7880
      FLUX_LIVEKIT_API_KEY: ${FLUX_LIVEKIT_API_KEY:?Set a disposable test key}
      FLUX_LIVEKIT_API_SECRET: ${FLUX_LIVEKIT_API_SECRET:?Set a disposable test secret}
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks: [default, livekit-media, livekit-signal]
  ui-test:
    networks: [default, livekit-media]
