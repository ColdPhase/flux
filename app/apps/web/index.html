<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111">
  <meta name="theme-color" content="#F4F4F5">
  <meta name="description" content="Flux, an open source workspace for people and agents.">
  <title>Flux</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Flux">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    /* The splash: the logo and a thin progress line while the app starts (Kreska's small moments, F-026).
       Booting (app/errors.tsx) shows the same markup, so nothing jumps when React takes over. */
    .boot { --boot-ink: #18181B; --boot-on: #FFFFFF; --boot-line: rgba(0, 0, 0, .1); position: fixed; inset: 0; display: grid; place-content: center; justify-items: start; gap: 14px; background: var(--bg, #F4F4F5); color: var(--boot-ink); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .boot { --boot-ink: #F0F0F0; --boot-on: #111111; --boot-line: rgba(255, 255, 255, .12); } }
    :root[data-theme="dark"] .boot { --boot-ink: #F0F0F0; --boot-on: #111111; --boot-line: rgba(255, 255, 255, .12); }
    :root[data-kreska="off"] .boot--moment { display: none; }
    .boot--plain { display: none; }
    :root[data-kreska="off"] .boot--plain { display: grid; }
    .boot__text { font: 500 1rem/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--boot-ink); }
    .boot__lockup { display: flex; align-items: center; gap: 14px; }
    .boot__lockup b { font: 600 2.1rem/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -.04em; }
    .boot__tile { fill: var(--boot-ink); }
    .boot__face { stroke: var(--boot-on); }
    .boot__bar { display: block; width: 100%; height: 3px; border-radius: 3px; background: var(--boot-line); overflow: hidden; }
    .boot__bar u { display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--boot-ink); }
    @media (prefers-reduced-motion: no-preference) { .boot__bar u { animation: boot-run 1.4s ease-in-out infinite; } }
    @keyframes boot-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
  <script>
    // Read before the first paint: the stored theme and whether Kreska's small moments are on.
    try {
      var t = localStorage.getItem('flux.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      if (localStorage.getItem('flux.kreska') === 'off') document.documentElement.dataset.kreska = 'off';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"><div class="boot boot--moment" role="status" aria-label="Opening Flux"><div class="boot__lockup"><svg class="boot__logo" viewBox="0 0 24 24" width="56" height="56" aria-hidden="true"><path d="M7 0H17C21.2 0 24 2.8 24 7V17C24 21.2 21.2 24 17 24H7C2.8 24 0 21.2 0 17V7C0 2.8 2.8 0 7 0Z" class="boot__tile"/><g class="boot__face" transform="translate(12 12) scale(1.14) translate(-12 -12.4)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.3 11.2V13.8M14.7 11.2V13.8"/><path d="M7.3 8.1 10.5 7.2" stroke-width="1.55"/></g></svg><b>flux</b></div><i class="boot__bar" aria-hidden="true"><u></u></i></div><div class="boot boot--plain" role="status"><p class="boot__text">Opening Flux…</p></div></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
