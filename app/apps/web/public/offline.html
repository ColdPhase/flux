<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F5">
<title>Flux — offline</title>
<script>try { if (localStorage.getItem("flux.moments") === "off") document.documentElement.dataset.moments = "off"; } catch (e) {}</script>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #F4F4F5; --text: #18181B; --muted: #6B6B6B; --inv: #18181B; --on-inv: #FFFFFF; --line: rgba(0, 0, 0, .07); }
  @media (prefers-color-scheme: dark) { :root { --bg: #111111; --text: #F0F0F0; --muted: #8C8C8C; --inv: #F0F0F0; --on-inv: #111111; --line: rgba(255, 255, 255, .08); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 26rem; text-align: left; }
  .app-icon { width: 48px; height: 48px; border-radius: 12px; }
  .face { display: block; color: var(--text); overflow: visible; }
  html[data-moments="off"] .face { display: none; }
  html:not([data-moments="off"]) .app-icon { display: none; }
  h1 { font-size: 1.25rem; margin: 16px 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); }
  button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--inv); color: var(--on-inv); font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img class="app-icon" src="/icons/icon-192.png" alt="">
  <svg class="face" viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><path d="M8.6 2.6H15.4C19 2.6 21.4 5 21.4 8.6V15.4C21.4 19 19 21.4 15.4 21.4H8.6C5 21.4 2.6 19 2.6 15.4V8.6C2.6 5 5 2.6 8.6 2.6Z" fill="none" stroke="currentColor" stroke-width="1.15"/><path d="M8 12.8Q9.3 13.8 10.6 12.8M13.4 12.8Q14.7 13.8 16 12.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M7.3 9 10.5 8.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M17.2 4.6H19.4L17.2 6.8H19.4M20.4 1.4H22L20.4 3H22" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1 id="flux-offline-title">You are offline</h1>
  <p>Flux cannot reach its server right now. Nothing you already sent is lost; open Flux again when your connection is back.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
