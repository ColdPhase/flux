<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F5">
<title>Flux — offline</title>
<script>try { if (localStorage.getItem("flux.kreska") === "off") document.documentElement.dataset.kreska = "off"; } catch (e) {}</script>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
  /* The app's own tokens (docs/design/final/README.md §2): Geist, --t1/--t3/--inv, a 20 px title at 600, and a flat button with radius 10 (--r-btn) at the
     button height of a row (32 px, 44 on touch). The font is the stable copy the app serves, which its service worker has cached. */
  @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("/fonts/Geist-Variable.woff2") format("woff2"); }
  :root { color-scheme: light dark; --bg: #F4F4F5; --text: #18181B; --muted: #636363; --inv: #18181B; --on-inv: #FFFFFF; --line: rgba(0, 0, 0, .07); --r-btn: 10px; --fs-base: .9375rem; --fs-xl: 1.25rem; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111111; --text: #F0F0F0; --muted: #A1A1A1; --inv: #F0F0F0; --on-inv: #111111; --line: rgba(255, 255, 255, .08); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 400 var(--fs-base)/1.5 "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 26rem; text-align: left; }
  .app-icon { width: 48px; height: 48px; border-radius: 12px; }
  .face { display: block; color: var(--text); overflow: visible; }
  html[data-kreska="off"] .face { display: none; }
  html:not([data-kreska="off"]) .app-icon { display: none; }
  h1 { font-size: var(--fs-xl); font-weight: 600; line-height: 1.25; letter-spacing: -.015em; margin: 16px 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); }
  button { min-height: 32px; padding: 0 14px; border: 0; border-radius: var(--r-btn); background: var(--inv); color: var(--on-inv); font: inherit; font-weight: 500; cursor: pointer; }
  @media (pointer: coarse) { button { min-height: 44px; } }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img class="app-icon" src="/icons/icon-192.png" alt="">
  <svg class="face" viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><path d="M8.6 2.6H15.4C19 2.6 21.4 5 21.4 8.6V15.4C21.4 19 19 21.4 15.4 21.4H8.6C5 21.4 2.6 19 2.6 15.4V8.6C2.6 5 5 2.6 8.6 2.6Z" fill="none" stroke="currentColor" stroke-width="1.15"/><path d="M8 12.8Q9.3 13.8 10.6 12.8M13.4 12.8Q14.7 13.8 16 12.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M7.3 9 10.5 8.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M17.2 4.6H19.4L17.2 6.8H19.4M20.4 1.4H22L20.4 3H22" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1 id="flux-offline-title">You are offline</h1>
  <p>Flux cannot reach its server right now. Nothing you already sent is lost; open Flux again when your connection is back.</p>
  <button type="button" id="flux-offline-retry">Try again</button>
</main>
<script>document.getElementById("flux-offline-retry").addEventListener("click", function () { location.reload(); });</script>
</body>
</html>
