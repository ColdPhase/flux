packages:
  - apps/*
  - packages/*
  - examples/*
allowBuilds:
  esbuild: true
  # The agent runtime's PTY for the sign-in console (F-022 T4): compiled from source in the build stage.
  node-pty: true

patchedDependencies:
  '@better-auth/oauth-provider@1.7.19': patches/oauth-provider-1.7.19-flux-refresh.patch
  drizzle-orm@0.45.4: patches/drizzle-orm-0.45.4-flux-pool-release.patch

# One stable public codec generation across server, binding and browser.
overrides:
  yjs: 13.6.33
  # The one patched OAuth provider (patchedDependencies above) that @better-auth/mcp and @better-auth/cimd share. Move this,
  # the patch file and its key together when the better-auth packages move.
  '@better-auth/oauth-provider': 1.7.19
