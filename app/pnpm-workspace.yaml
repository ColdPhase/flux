packages:
  - apps/*
  - packages/*
  - examples/*
allowBuilds:
  esbuild: true
  # The agent runtime's PTY for the sign-in console (F-022 T4): compiled from source in the build stage.
  node-pty: true

# pdfjs-dist's optional canvas for Node (the PDF viewer frame draws in the browser): never installed, so the build and the image do not fetch it.
ignoredOptionalDependencies:
  - '@napi-rs/canvas'

patchedDependencies:
  '@better-auth/oauth-provider@1.7.18': patches/oauth-provider-1.7.18-flux-refresh.patch
  drizzle-orm@0.45.4: patches/drizzle-orm-0.45.4-flux-pool-release.patch

# One stable public codec generation across server, binding and browser.
overrides:
  yjs: 13.6.33
