# ZAP rules for scripts/check_dast.sh (#838). One rule per line, tab-separated: rule id, action, description, reason.
# IGNORE needs a reason; OUTOFSCOPE (rule, a regex of urls, a reason) drops one rule's alerts on those urls only; "Tracked in #N: ..." marks a REAL finding accepted until that issue lands, anything else a false positive.
# summarize.py fails the run (exit 10) for any Medium or higher alert that is not IGNOREd here, so a new finding has to be fixed or triaged.
# Rule ids and names: https://www.zaproxy.org/docs/alerts/

10062	IGNORE	PII Disclosure	Not card numbers. ZAP matches the 12-digit last group of a UUID id (for example ...-578174087739 in a map thought's id), which passes the card checksum by chance. Every id in the API is a UUID and Flux stores no card numbers.
2	OUTOFSCOPE	^https?://[^/]+/api/auth/get-session(\?.*)?$	The caller's own session: GET /api/auth/get-session returns the session's ipAddress to the person who owns it (Better Auth's documented session record). It is the address that person signed in from, never a server address. Only this url: a private address anywhere else in a response still shows.
10055	IGNORE	~^CSP: style-src unsafe-inline$	Accepted risk: style-src keeps 'unsafe-inline' (the Content-Security-Policy of #979 is strict for scripts, connections, frames, forms and <base>). React sets style attributes, the Wiki's table alignment is a style attribute and the editor and terminal libraries add style elements; a style cannot run code. What injected CSS could still do is restyle or hide the page. A nonce for every style would be a project of its own.
