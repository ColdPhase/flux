<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Flux — offline</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #FFFFFF; --text: #1B1C1F; --muted: #5E6068; --accent: #5159C8; --on-accent: #FFFFFF; --line: #E7E7EA; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141517; --text: #EDEDEF; --muted: #A0A2AA; --accent: #8B90F0; --on-accent: #101113; --line: #26272B; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 26rem; text-align: left; }
  img { width: 48px; height: 48px; border-radius: 12px; }
  h1 { font-size: 1.25rem; margin: 16px 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); }
  button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1 id="flux-offline-title">You are offline</h1>
  <p>Flux cannot reach its server right now. Nothing you already sent is lost; open Flux again when your connection is back.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
