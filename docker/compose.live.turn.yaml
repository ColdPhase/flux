# Operator-owned restrictive-network relay. Layer after compose.source.yaml and
# compose.live.yaml. A separate DNS name/certificate is required for TURN/TLS.
services:
  livekit:
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        prometheus_port: 6789
        keys:
          "${FLUX_LIVEKIT_API_KEY:?Set the LiveKit API key}": "${FLUX_LIVEKIT_API_SECRET:?Set the LiveKit API secret}"
        webhook:
          api_key: "${FLUX_LIVEKIT_API_KEY:?Set the LiveKit API key}"
          urls:
            - http://api:8080/api/v1/internal/livekit/webhook
        room:
          auto_create: false
          max_participants: 16
          empty_timeout: 420
          departure_timeout: 180
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${FLUX_LIVEKIT_PUBLIC_IP:?Set the public IP advertised to media clients}
          # Only the media interface carries ICE (#63). On a host with several interfaces, set it to the
          # media address (for example 203.0.113.20/32); the default keeps every IPv4 interface.
          ips:
            includes: ["${FLUX_LIVEKIT_MEDIA_CIDR:-0.0.0.0/0}"]
          stun_servers:
            - ${FLUX_LIVEKIT_TURN_DOMAIN:?Set the TURN TLS DNS name}:3478
        turn:
          enabled: true
          domain: ${FLUX_LIVEKIT_TURN_DOMAIN:?Set the TURN TLS DNS name}
          udp_port: 3478
          tls_port: 443
          cert_file: /run/livekit-turn-certs/fullchain.pem
          key_file: /run/livekit-turn-certs/privkey.pem
    volumes:
      - ${FLUX_LIVEKIT_TURN_CERT_DIR:?Set the directory with fullchain.pem and privkey.pem}:/run/livekit-turn-certs:ro,z
    ports:
      - ${FLUX_LIVEKIT_TURN_TLS_BIND:-0.0.0.0}:${FLUX_LIVEKIT_TURN_TLS_HOST_PORT:-443}:443/tcp
