# TEST ONLY (#228): selects the development live map/wiki editing path on the API of an isolated
# check stack. Use through scripts/check_live_editing.sh or scripts/check_live_editing_restart.sh.
# Selects the production path and separate diagnostic marker. This overlay is not needed by
# ordinary installations and must not be used to override an operator's intentional opt-out.
services:
  test:
    environment:
      FLUX_LIVE_EDITING: "on"
  ui-test:
    environment:
      FLUX_LIVE_EDITING: "on"
      FLUX_LIVE_EDITING_TEST: "1"
  api:
    # The latency run stops the API itself and inspects its clean exit (live-editing-verification.md).
    restart: "no"
    environment:
      FLUX_LIVE_EDITING: "on"
      FLUX_DEVELOPMENT_LIVE_EDITING: "true"
      # Bounded development queue telemetry on stdout, only for the latency run (empty otherwise).
      FLUX_DEVELOPMENT_LIVE_EDITING_TELEMETRY: ${FLUX_DEVELOPMENT_LIVE_EDITING_TELEMETRY:-}
      FLUX_DEVELOPMENT_LIVE_EDITING_API_INSTANCE: ${FLUX_DEVELOPMENT_LIVE_EDITING_API_INSTANCE:-}
  # A second API process on the same image, database, secret and public origin (Gate 3
  # cross-process fixture, tests/app/live/two-api.test.ts). Only `--two-api` starts it.
  api-two:
    profiles: ["two-api"]
    extends:
      file: compose.source.yaml
      service: api
    restart: "no"
    ports: !reset []
    environment:
      FLUX_LIVE_EDITING: "on"
      FLUX_DEVELOPMENT_LIVE_EDITING: "true"
