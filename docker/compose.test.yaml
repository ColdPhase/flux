# Test-only Web Push and browser wiring (issue #41), layered over compose.source.yaml by
# scripts/check_application.sh with the `test` profile. Never use it for a real deployment:
# it lets the worker reach a private-network push mock and trust its throwaway certificate.
services:
  files-init:
    # The non-root application test runner also writes session/browser seed state.
    command: ["chown", "-R", "1000:1000", "/data/files", "/state"]
    volumes:
      - teststate:/state
  pushmock:
    profiles: ["test"]
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
      target: e2e
    image: flux-e2e:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    # A fresh self-signed certificate per run: web-push only speaks https.
    command:
      - sh
      - -c
      - >-
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 2
        -subj /CN=pushmock -addext subjectAltName=DNS:pushmock,DNS:mailpit-starttls,DNS:mailpit-smtps
        -keyout /tls/key.pem -out /tls/cert.pem 2>/dev/null && chmod 644 /tls/key.pem &&
        exec node_modules/.bin/tsx tests/app/support/push-mock.ts
    volumes:
      - pushtls:/tls
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  # Operator TLS paths for notification email (#116, #113): SMTP catchers that refuse plain
  # text, one requiring STARTTLS (port 587 style) and one implicit TLS (smtps, port 465 style).
  # They use the per-run throwaway certificate, which the test container trusts.
  mailpit-starttls: &tls-mailpit
    profiles: ["test"]
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_TLS_CERT: /tls/cert.pem
      MP_SMTP_TLS_KEY: /tls/key.pem
      MP_SMTP_REQUIRE_STARTTLS: "true"
    volumes:
      - pushtls:/tls:ro
    depends_on:
      pushmock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20
  mailpit-smtps:
    <<: *tls-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_TLS_CERT: /tls/cert.pem
      MP_SMTP_TLS_KEY: /tls/key.pem
      MP_SMTP_REQUIRE_TLS: "true"
  # TEST ONLY (#179, F-020 PROV-6): both AI wire formats for the adapter contract suite
  # (app/tests/app/support/provider-mock.ts). Never a provider; nothing here is a provider pass.
  providermock:
    profiles: ["test"]
    image: flux-test-tools:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["node_modules/.bin/tsx", "tests/app/support/provider-mock.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8095/__health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    environment:
      # The operator allowlist lets owner endpoints reach the local provider mock only.
      FLUX_AI_PRIVATE_TARGETS: providermock
      # Pool connection wait for this suite (#271, docs/development/containers.md): new connections and
      # short waits while other stacks share the host. Production keeps 1.5 s.
      FLUX_DB_CONNECT_TIMEOUT_MS: ${FLUX_DB_CONNECT_TIMEOUT_MS:-10000}
  # TEST ONLY (#316): a second API process on the same database, so a policy change made on one
  # instance is proven to order against delivery held on the other. No host port.
  api2:
    extends:
      file: compose.source.yaml
      service: api
    ports: !reset []
    environment:
      FLUX_AI_PRIVATE_TARGETS: providermock
      FLUX_DB_CONNECT_TIMEOUT_MS: ${FLUX_DB_CONNECT_TIMEOUT_MS:-10000}
  worker:
    environment:
      FLUX_AI_PRIVATE_TARGETS: providermock
      FLUX_DB_CONNECT_TIMEOUT_MS: ${FLUX_DB_CONNECT_TIMEOUT_MS:-10000}
      FLUX_PUSH_ALLOW_PRIVATE_NETWORK: "true"
      NODE_EXTRA_CA_CERTS: /tls/cert.pem
    volumes:
      - pushtls:/tls:ro
    depends_on:
      pushmock:
        condition: service_healthy
  test:
    environment:
      FLUX_TEST_FILES_DIR: /data/files
      # The suite's own pools too, including the fresh databases of the migration tests.
      FLUX_DB_CONNECT_TIMEOUT_MS: ${FLUX_DB_CONNECT_TIMEOUT_MS:-10000}
      FLUX_VAPID_PUBLIC_KEY: ${FLUX_VAPID_PUBLIC_KEY:-}
      FLUX_VAPID_PRIVATE_KEY: ${FLUX_VAPID_PRIVATE_KEY:-}
      FLUX_VAPID_SUBJECT: ${FLUX_VAPID_SUBJECT:-}
      FLUX_PUSH_ALLOW_PRIVATE_NETWORK: "true"
      FLUX_PUSHMOCK_URL: http://pushmock:8081
      FLUX_MAILPIT_STARTTLS_URL: http://mailpit-starttls:8025
      FLUX_MAILPIT_SMTPS_URL: http://mailpit-smtps:8025
      FLUX_PROVIDER_MOCK_URL: http://providermock:8095
      FLUX_API2_URL: http://api2:8080
      NODE_EXTRA_CA_CERTS: /tls/cert.pem
    volumes:
      - pushtls:/tls:ro
      - files:/data/files:z
    depends_on:
      api2:
        condition: service_healthy
      worker:
        condition: service_started
      pushmock:
        condition: service_healthy
      mailpit-starttls:
        condition: service_healthy
      mailpit-smtps:
        condition: service_healthy
      providermock:
        condition: service_healthy
  e2e:
    profiles: ["test"]
    image: flux-e2e:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    environment:
      # Only the protocol browser fixture seeds its registered OAuth client (#152).
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
      FLUX_DB_CONNECT_TIMEOUT_MS: ${FLUX_DB_CONNECT_TIMEOUT_MS:-10000}
      FLUX_AUTH_SECRET: ${FLUX_AUTH_SECRET:?Set FLUX_AUTH_SECRET}
      FLUX_API_URL: http://api:8080
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      FLUX_E2E_EVIDENCE_DIR: ${FLUX_E2E_EVIDENCE_DIR:-}
    volumes:
      - teststate:/state
    depends_on:
      api:
        condition: service_healthy
  # OPT-IN (#152 AC-4, scripts/check_mcp_clients.sh): the real pinned Codex and Claude Code CLIs register Flux's
  # MCP server with their own `mcp add`, complete its OAuth in Chromium and use its tools against a scripted model
  # endpoint. Needs internet to download Claude Code at run time (see the Dockerfile `mcp-clients` stage).
  mcp-clients:
    profiles: ["mcp-clients"]
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
      target: mcp-clients
    image: flux-mcp-clients:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command:
      - sh
      - -c
      - node apps/runtime/dist/install/main.js && exec node_modules/.bin/tsx --test --test-concurrency=1 tests/app/e2e/mcp-clients.e2e.ts tests/app/e2e/mcp-onboarding.e2e.ts
    environment:
      FLUX_AGENT_RUNTIME: claude_code
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
      FLUX_DB_CONNECT_TIMEOUT_MS: ${FLUX_DB_CONNECT_TIMEOUT_MS:-10000}
      FLUX_AUTH_SECRET: ${FLUX_AUTH_SECRET:?Set FLUX_AUTH_SECRET}
      FLUX_API_URL: http://api:8080
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
    depends_on:
      api:
        condition: service_healthy
volumes:
  pushtls:
