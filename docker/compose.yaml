# Flux operator Compose: runs a PUBLISHED Flux release. No source checkout, no build.
#
# The repository copy (docker/compose.yaml) is the example for a future release. It is NOT
# what `./flux up` runs (that builds the checked-out source from docker/compose.source.yaml) and does
# not start as is: its placeholder digests RELEASE_DIGEST and DATABASE_DIGEST are replaced by the release workflow
# (#77) with the accepted manifest digests of ghcr.io/coldphase/flux and flux-database. Download compose.yaml and
# .env.example from ONE GitHub Release; their image digest, migrations and variables match.
#
#   cp .env.example .env    # then fill in the required values, see .env.example
#   docker compose --env-file .env -f compose.yaml config --quiet
#   docker compose --env-file .env -f compose.yaml up -d --wait
#
# In this repository the same command reads docker/.env:
#   docker compose --env-file docker/.env -f docker/compose.yaml up -d --wait
# Install, upgrade and backup: docs/operations/install-release.md.
#
# api, worker, keyring and migrate run one image at one revision (O-002); the database image of the same release is pinned by
# digest. Only the API is published, on loopback: put a TLS reverse proxy in front of it.
name: ${FLUX_PROJECT:-flux}

services:
  db:
    # Flux's database image (F-042): PostgreSQL 18 with pg_search, built by the release from docker/database/Dockerfile.
    image: ghcr.io/coldphase/flux-database@sha256:DATABASE_DIGEST
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-flux}
    # Memory equal to memory+swap, like the other services. With the defaults here the base stack's limits add up to
    # under 3 GiB, so it fits a 4 GB host with room for the system (#862).
    mem_limit: ${FLUX_DB_MEMORY:-768m}
    memswap_limit: ${FLUX_DB_MEMORY:-768m}
    volumes:
      - pgdata:/var/lib/postgresql
    # Cheap probes (#862): a probe is an `exec` into the container, so it runs rarely. During the first minute it runs every
    # quarter second, so a start does not wait for an interval and a slow first start (initdb, a big migration) is not counted as failing.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 250ms
  migrate:
    # One-shot: applies the release's SQL migrations in order, then exits. API and worker
    # start only after it succeeded.
    image: ghcr.io/coldphase/flux@sha256:RELEASE_DIGEST
    command: ["node", "tooling/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-flux}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    image: ghcr.io/coldphase/flux@sha256:RELEASE_DIGEST
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-flux}
      # Empty disables the integration fixture endpoint. Leave empty on a real deployment.
      FLUX_FIXTURE_TOKEN: ${FLUX_FIXTURE_TOKEN:-}
      FLUX_FILES_DIR: /data/files
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN in .env}
      FLUX_AUTH_SECRET: ${FLUX_AUTH_SECRET:?Set FLUX_AUTH_SECRET in .env}
      FLUX_TRUSTED_PROXIES: ${FLUX_TRUSTED_PROXIES:-}
      FLUX_SMTP_URL: ${FLUX_SMTP_URL:-}
      FLUX_MAIL_FROM: ${FLUX_MAIL_FROM:-}
      FLUX_PASSWORD_RESET_TTL_SECONDS: ${FLUX_PASSWORD_RESET_TTL_SECONDS:-3600}
      # How long a session lasts unused, and the longest it lasts from sign-in (#993), such as 30m, 12h or 7d; empty is 7d and 30d.
      FLUX_SESSION_IDLE: ${FLUX_SESSION_IDLE:-}
      FLUX_SESSION_MAX_AGE: ${FLUX_SESSION_MAX_AGE:-}
      # Optional single sign-on (#113): issuer and client id switch it on; the secret is a file.
      FLUX_OIDC_ISSUER: ${FLUX_OIDC_ISSUER:-}
      FLUX_OIDC_CLIENT_ID: ${FLUX_OIDC_CLIENT_ID:-}
      FLUX_OIDC_CLIENT_SECRET_FILE: /run/secrets/flux_oidc_client_secret
      FLUX_OIDC_LABEL: ${FLUX_OIDC_LABEL:-}
      FLUX_SSO_MODE: ${FLUX_SSO_MODE:-sso}
      # How long the provider's last confirmation of a person keeps their access, 1h to 30d (F-024 S2); empty is 7d.
      FLUX_OIDC_CONFIRMATION_MAX_AGE: ${FLUX_OIDC_CONFIRMATION_MAX_AGE:-}
      # Standing check of the person's account at the provider (F-024 S4, #311).
      FLUX_OIDC_STANDING: ${FLUX_OIDC_STANDING:-refresh}
      FLUX_OIDC_STANDING_INTERVAL_SECONDS: ${FLUX_OIDC_STANDING_INTERVAL_SECONDS:-900}
      FLUX_AUTH_RATE_LIMIT: ${FLUX_AUTH_RATE_LIMIT:-true}
      # The setup link's token (#1471): the first account, the company's owner, comes from <origin>/setup#<token>; every other one from
      # an invite link or single sign-on. ./flux up writes it; once the company exists it does nothing.
      FLUX_SETUP_TOKEN: ${FLUX_SETUP_TOKEN:-}
      # Web Push: the API only needs the public key; empty reports push unavailable.
      FLUX_VAPID_PUBLIC_KEY: ${FLUX_VAPID_PUBLIC_KEY:-}
      FLUX_STREAM_HEARTBEAT_MS: ${FLUX_STREAM_HEARTBEAT_MS:-25000}
      FLUX_LIVE_EDITING: ${FLUX_LIVE_EDITING:-on}
      # Link cards (#469): off unless `on`; see docker/.env.example.
      FLUX_LINK_PREVIEWS: ${FLUX_LINK_PREVIEWS:-off}
      # The most MiB one video may be (C-61, #1352); other files stay at 5 MiB. See docker/.env.example.
      FLUX_VIDEO_MAX_MIB: ${FLUX_VIDEO_MAX_MIB:-200}
      # Agents reading and searching the web (#918, #954, C-29): on unless `off`.
      FLUX_WEB_READS: ${FLUX_WEB_READS:-on}
      # Owner AI connections (F-020): agents on a person's own API key are off unless `on`; they also need the
      # background key file (FLUX_BACKGROUND_KEY_HOST_FILE, see docs/operations/configuration.md).
      # Private targets an OpenAI-compatible endpoint may reach; empty allows public HTTPS endpoints only.
      FLUX_AI_PRIVATE_TARGETS: ${FLUX_AI_PRIVATE_TARGETS:-}
      FLUX_PERSONAL_RUNS: ${FLUX_PERSONAL_RUNS:-}
      # GitHub App integration (#74). All empty reports unavailable.
      FLUX_GITHUB_CLIENT_ID: ${FLUX_GITHUB_CLIENT_ID:-}
      FLUX_GITHUB_CLIENT_SECRET: ${FLUX_GITHUB_CLIENT_SECRET:-}
      FLUX_GITHUB_APP_ID: ${FLUX_GITHUB_APP_ID:-}
      FLUX_GITHUB_APP_SLUG: ${FLUX_GITHUB_APP_SLUG:-}
      FLUX_GITHUB_WEBHOOK_SECRET: ${FLUX_GITHUB_WEBHOOK_SECRET:-}
      FLUX_GITHUB_DELIVERY: ${FLUX_GITHUB_DELIVERY:-webhook}
      FLUX_GITHUB_ENCRYPTION_KEY: ${FLUX_GITHUB_ENCRYPTION_KEY:-}
      # Encrypted workspaces (F-030): the keyring below, on its internal network. FLUX_KEYRING=off disables them.
      FLUX_KEYRING: ${FLUX_KEYRING:-on}
      FLUX_KEYRING_TOKEN: ${FLUX_KEYRING_TOKEN:-}
      FLUX_KEY_PIN_SECRET: ${FLUX_KEY_PIN_SECRET:-}
      FLUX_SWAP_ACKNOWLEDGED: ${FLUX_SWAP_ACKNOWLEDGED:-}
      PORT: 8080
    # Memory equal to memory+swap: no swap for this container (F-030); core dumps off.
    mem_limit: ${FLUX_API_MEMORY:-1536m}
    memswap_limit: ${FLUX_API_MEMORY:-1536m}
    ulimits:
      core: 0
    networks: [default, keyring]
    volumes:
      # The image owns /data/files as its non-root user, so a new volume starts writable.
      # "z" relabels the shared volume for SELinux hosts and is ignored elsewhere.
      - files:/data/files:z
    ports:
      - 127.0.0.1:${FLUX_PORT:-8081}:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
      keyring:
        condition: service_started
    # `wget` of the image's busybox, not a Node process: starting Node costs about 70 ms of CPU per probe (#862). `-Y off`: a proxy variable of the
    # environment must not send the loopback probe elsewhere.
    healthcheck:
      test: ["CMD", "wget", "-q", "-Y", "off", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 250ms
  worker:
    image: ghcr.io/coldphase/flux@sha256:RELEASE_DIGEST
    restart: unless-stopped
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-flux}
      # Notification email uses the instance SMTP transport and links to the public origin.
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN in .env}
      FLUX_SMTP_URL: ${FLUX_SMTP_URL:-}
      FLUX_MAIL_FROM: ${FLUX_MAIL_FROM:-}
      # The worker signs Web Push requests. Set all three or none.
      FLUX_VAPID_PUBLIC_KEY: ${FLUX_VAPID_PUBLIC_KEY:-}
      FLUX_VAPID_PRIVATE_KEY: ${FLUX_VAPID_PRIVATE_KEY:-}
      FLUX_VAPID_SUBJECT: ${FLUX_VAPID_SUBJECT:-}
      # The same switches and allowlist as the API: the worker runs agents on API keys and checks the allowlist at every request.
      FLUX_AI_PRIVATE_TARGETS: ${FLUX_AI_PRIVATE_TARGETS:-}
      FLUX_PERSONAL_RUNS: ${FLUX_PERSONAL_RUNS:-}
      # The same web switch as the API (#954): `off` offers no run its provider's web search.
      FLUX_WEB_READS: ${FLUX_WEB_READS:-on}
      FLUX_KEYRING: ${FLUX_KEYRING:-on}
      FLUX_KEYRING_TOKEN: ${FLUX_KEYRING_TOKEN:-}
      FLUX_KEY_PIN_SECRET: ${FLUX_KEY_PIN_SECRET:-}
      FLUX_SWAP_ACKNOWLEDGED: ${FLUX_SWAP_ACKNOWLEDGED:-}
    mem_limit: ${FLUX_WORKER_MEMORY:-512m}
    memswap_limit: ${FLUX_WORKER_MEMORY:-512m}
    ulimits:
      core: 0
    networks: [default, keyring]
    volumes:
      - files:/data/files:z
    depends_on:
      migrate:
        condition: service_completed_successfully
  keyring:
    # Encrypted workspaces (F-030): one random boot key in RAM only, nothing on disk; exactly one per deployment,
    # on this host only. It refuses to start where its memory could be paged to disk.
    image: ghcr.io/coldphase/flux@sha256:RELEASE_DIGEST
    command: ["node", "apps/keyring/dist/main.js"]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    ulimits:
      core: 0
    mem_limit: ${FLUX_KEYRING_MEMORY:-128m}
    memswap_limit: ${FLUX_KEYRING_MEMORY:-128m}
    pids_limit: 32
    environment:
      FLUX_KEYRING_TOKEN: ${FLUX_KEYRING_TOKEN:-}
      FLUX_SWAP_ACKNOWLEDGED: ${FLUX_SWAP_ACKNOWLEDGED:-}
      NODE_OPTIONS: --secure-heap=65536
    networks: [keyring]
    # The shell and `nc` of the image's busybox, not a Node process (#862). The token goes through the pipe, never an argument,
    # so no process list shows it. Without a token the keyring is idle and healthy; with one, `/v1/boot` must answer 200.
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$FLUX_KEYRING_TOKEN\" ] || { printf 'GET /v1/boot HTTP/1.0\\r\\nAuthorization: Bearer %s\\r\\n\\r\\n' \"$$FLUX_KEYRING_TOKEN\" | nc -w 3 127.0.0.1 8090 | head -n 1 | grep -q ' 200 '; }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 250ms

networks:
  default: {}
  # api, worker and keyring only: workspace keys cross it, and it never leaves this host.
  keyring:
    internal: true

volumes:
  pgdata:
  files:
