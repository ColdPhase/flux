# TEST ONLY (F-030 AC-4, #655): layered over compose.source.yaml and compose.test.yaml by scripts/check_encryption.sh.
# PostgreSQL logs every statement with its full parameters, so the run can prove that no password, recovery code,
# KEK, holder private key, DEK or subkey ever reaches the database, not even as a bind parameter or in an error.
# Never use it for a deployment.
services:
  db:
    command: ["postgres", "-c", "log_statement=all", "-c", "log_parameter_max_length=-1", "-c", "log_parameter_max_length_on_error=-1",
      "-c", "log_min_error_statement=error"]
  keyring:
    environment:
      # The boot key becomes a canary of the log scan (TEST ONLY; needs the test deployment switches too).
      FLUX_KEYRING_REVEAL_BOOT_KEY: "true"
  # A sealed chooser search opens at most this many objects here, so its truncation marker (`searchLimited`) is tested
  # without thousands of tasks (TEST ONLY; honoured only by a test deployment). The test runner reads it too.
  api:
    environment:
      FLUX_TEST_SEALED_CHOOSER_SCAN_LIMIT: "8"
  api2:
    environment:
      FLUX_TEST_SEALED_CHOOSER_SCAN_LIMIT: "8"
  test:
    environment:
      FLUX_TEST_SEALED_CHOOSER_SCAN_LIMIT: "8"
      # AC-13 (S2c): the offline checker reads the file objects of a post-rotation copy.
      FLUX_FILES_DIR: /data/files
    volumes:
      - files:/data/files:ro,z
  # S2c (TEST ONLY; honoured only by a test deployment): small pages and a fast sweep so rotations of small fixtures
  # take several pages, and a hold after N pages so check_encryption.sh can kill the worker mid-rotation.
  worker:
    environment:
      FLUX_TEST_ROTATION_PAGE_SIZE: "2"
      FLUX_TEST_ROTATION_SWEEP_MS: "300"
      FLUX_TEST_ROTATION_HOLD_AFTER_PAGES: ${FLUX_TEST_ROTATION_HOLD_AFTER_PAGES:-}
