# The pinned PostgreSQL image, shared by the database and the backup helper (issue #123).
x-postgres-image: &postgres-image postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873

# --- The agent runtime (F-022 AIM-3, T3 #278): profile `runtime`, started by ./flux only when the
# operator sets FLUX_AGENT_RUNTIME (empty, the default, is off). No service here, or anywhere in Flux,
# mounts a Docker or Podman socket: the slots are a fixed pool declared below, and every container
# setting is static. See docs/operations/agent-runtime.md.
# Internal runtime networks get no address on the host's bridge, so nothing in them reaches the host
# itself either (Docker otherwise gives the bridge the network's gateway address).
x-runtime-network-opts: &runtime-network-opts
  com.docker.network.bridge.inhibit_ipv4: "true"
x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
x-runtime-hardening: &runtime-hardening
  profiles: ["runtime"]
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  logging: *runtime-logging
# One slot. Extra slots repeat this block with their own number in an operator override; see the guide.
x-runtime-slot: &runtime-slot
  <<: *runtime-hardening
  image: flux-agent-runtime:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
  mem_limit: 2g
  memswap_limit: 2g
  cpus: 1
  pids_limit: 256
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m,mode=1777
  # A release ends with the supervisor exiting; this starts a fresh one with an empty /tmp.
  restart: always
  depends_on:
    runtime-install:
      condition: service_completed_successfully
    runtime-egress:
      condition: service_started

services:
  db:
    image: *postgres-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-flux}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 20
  migrate:
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
      labels:
        # Recorded in backup manifests (issue #123); ./flux sets it from `git rev-parse HEAD`.
        com.flux.commit: ${FLUX_GIT_COMMIT:-unknown}
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["node", "tooling/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  files-init:
    profiles: ["setup"]
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/data/files"]
    volumes:
      - files:/data/files:z
    restart: "no"
  files-archive:
    # One-shot helper of ./flux backup and restore (issue #123): streams the files volume as a
    # tar archive over stdin/stdout. The pinned PostgreSQL image is used because it is always
    # present with the database and provides tar, gzip and sha256sum. No network, no ports.
    profiles: ["ops"]
    image: *postgres-image
    user: "0:0"
    network_mode: none
    volumes:
      - files:/data/files:z
    restart: "no"
  api:
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
      FLUX_FIXTURE_TOKEN: ${FLUX_FIXTURE_TOKEN:?Set FLUX_FIXTURE_TOKEN}
      FLUX_TEST_FAILURE_INJECTION: ${FLUX_TEST_FAILURE_INJECTION:-false}
      # TEST ONLY (#68): fixture key connections for personal runs; empty in production.
      FLUX_TEST_PERSONAL_RUNS: ${FLUX_TEST_PERSONAL_RUNS:-}
      FLUX_FILES_DIR: /data/files
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      FLUX_AUTH_SECRET: ${FLUX_AUTH_SECRET:?Set FLUX_AUTH_SECRET}
      FLUX_TRUSTED_PROXIES: ${FLUX_TRUSTED_PROXIES:-}
      FLUX_SMTP_URL: ${FLUX_SMTP_URL:-}
      FLUX_MAIL_FROM: ${FLUX_MAIL_FROM:-}
      FLUX_PASSWORD_RESET_TTL_SECONDS: ${FLUX_PASSWORD_RESET_TTL_SECONDS:-3600}
      # Optional single sign-on (#113): issuer and client id switch it on; the secret is a file.
      FLUX_OIDC_ISSUER: ${FLUX_OIDC_ISSUER:-}
      FLUX_OIDC_CLIENT_ID: ${FLUX_OIDC_CLIENT_ID:-}
      FLUX_OIDC_CLIENT_SECRET_FILE: /run/secrets/flux_oidc_client_secret
      FLUX_OIDC_LABEL: ${FLUX_OIDC_LABEL:-}
      # Standing check of the person's account at the provider (F-024 S4, #311).
      FLUX_OIDC_STANDING: ${FLUX_OIDC_STANDING:-refresh}
      FLUX_OIDC_STANDING_INTERVAL_SECONDS: ${FLUX_OIDC_STANDING_INTERVAL_SECONDS:-900}
      FLUX_AUTH_RATE_LIMIT: ${FLUX_AUTH_RATE_LIMIT:-true}
      # Web Push (issue #41). The API only needs the public key; empty reports push unavailable.
      FLUX_VAPID_PUBLIC_KEY: ${FLUX_VAPID_PUBLIC_KEY:-}
      FLUX_STREAM_HEARTBEAT_MS: ${FLUX_STREAM_HEARTBEAT_MS:-25000}
      # Owner AI connections (#179, F-020): private targets an OpenAI-compatible endpoint may reach.
      # Empty allows public HTTPS endpoints only. See docs/development/containers.md.
      FLUX_AI_PRIVATE_TARGETS: ${FLUX_AI_PRIVATE_TARGETS:-}
      FLUX_PERSONAL_RUNS: ${FLUX_PERSONAL_RUNS:-}
      FLUX_BACKGROUND_COMPARISONS: ${FLUX_BACKGROUND_COMPARISONS:-}
      # GitHub App read-only integration (#74). Empty reports unavailable; configure all together.
      FLUX_GITHUB_CLIENT_ID: ${FLUX_GITHUB_CLIENT_ID:-}
      FLUX_GITHUB_CLIENT_SECRET: ${FLUX_GITHUB_CLIENT_SECRET:-}
      FLUX_GITHUB_APP_ID: ${FLUX_GITHUB_APP_ID:-}
      FLUX_GITHUB_APP_SLUG: ${FLUX_GITHUB_APP_SLUG:-}
      FLUX_GITHUB_WEBHOOK_SECRET: ${FLUX_GITHUB_WEBHOOK_SECRET:-}
      FLUX_GITHUB_ENCRYPTION_KEY: ${FLUX_GITHUB_ENCRYPTION_KEY:-}
      # The agent runtime (F-022 AIM-3): empty is off. See docs/operations/agent-runtime.md.
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      FLUX_AGENT_RUNTIME_COMMERCIAL_TERMS: ${FLUX_AGENT_RUNTIME_COMMERCIAL_TERMS:-}
      FLUX_AGENT_RUNTIME_IDLE_DAYS: ${FLUX_AGENT_RUNTIME_IDLE_DAYS:-}
      FLUX_RUNTIME_MANAGER_SECRET: ${FLUX_RUNTIME_MANAGER_SECRET:-}
      PORT: 8080
    # runtime-control reaches runtime-manager; runtime-api is where runtime-egress forwards /mcp.
    # Neither network holds the database.
    networks: [default, runtime-control, runtime-api]
    volumes:
      - files:/data/files:z
      # Optional 32-byte operator secret; empty tracked placeholder means unavailable.
      - ${FLUX_BACKGROUND_KEY_HOST_FILE:-./background-key-unavailable}:/run/secrets/flux_background_key:ro,z
      # Optional single sign-on client secret (#113); the empty placeholder is unused while sign-on is off.
      - ${FLUX_OIDC_CLIENT_SECRET_HOST_FILE:-./oidc-client-secret-unavailable}:/run/secrets/flux_oidc_client_secret:ro,z
    ports:
      - 127.0.0.1:${FLUX_PORT:-8081}:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20
  worker:
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    restart: unless-stopped
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
      # Notification email (#116) uses the instance SMTP transport and links to the public origin.
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      FLUX_SMTP_URL: ${FLUX_SMTP_URL:-}
      FLUX_MAIL_FROM: ${FLUX_MAIL_FROM:-}
      # The worker signs Web Push requests. Set all three or none.
      FLUX_VAPID_PUBLIC_KEY: ${FLUX_VAPID_PUBLIC_KEY:-}
      FLUX_VAPID_PRIVATE_KEY: ${FLUX_VAPID_PRIVATE_KEY:-}
      FLUX_VAPID_SUBJECT: ${FLUX_VAPID_SUBJECT:-}
      # TEST ONLY (#68): with FLUX_TEST_PERSONAL_RUNS=anthropic-mock the worker sends personal runs
      # through the real Anthropic adapter to this mock provider. Empty in production.
      FLUX_TEST_FAILURE_INJECTION: ${FLUX_TEST_FAILURE_INJECTION:-false}
      FLUX_TEST_PERSONAL_RUNS: ${FLUX_TEST_PERSONAL_RUNS:-}
      FLUX_TEST_ANTHROPIC_URL: ${FLUX_TEST_ANTHROPIC_URL:-}
      # The same operator allowlist as the API: the worker checks it again at every request.
      FLUX_AI_PRIVATE_TARGETS: ${FLUX_AI_PRIVATE_TARGETS:-}
      FLUX_PERSONAL_RUNS: ${FLUX_PERSONAL_RUNS:-}
      FLUX_BACKGROUND_COMPARISONS: ${FLUX_BACKGROUND_COMPARISONS:-}
      # The agent runtime (F-022 AIM-3): the worker reconciles slot bindings through runtime-manager.
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      FLUX_AGENT_RUNTIME_COMMERCIAL_TERMS: ${FLUX_AGENT_RUNTIME_COMMERCIAL_TERMS:-}
      FLUX_AGENT_RUNTIME_IDLE_DAYS: ${FLUX_AGENT_RUNTIME_IDLE_DAYS:-}
      FLUX_RUNTIME_MANAGER_SECRET: ${FLUX_RUNTIME_MANAGER_SECRET:-}
    networks: [default, runtime-control]
    volumes:
      - files:/data/files:z
      - ${FLUX_BACKGROUND_KEY_HOST_FILE:-./background-key-unavailable}:/run/secrets/flux_background_key:ro,z
    depends_on:
      migrate:
        condition: service_completed_successfully
  # --- Agent runtime services (profile `runtime`; see the x-runtime-* blocks at the top).
  runtime-install:
    # One-shot: installs the pinned, signature-checked Claude Code into the tools volume when
    # FLUX_AGENT_RUNTIME includes claude_code (Flux never ships it in an image); otherwise a no-op.
    <<: *runtime-hardening
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
      target: agent-runtime-install
    image: flux-agent-runtime-install:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["node", "apps/runtime/dist/install/main.js"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    environment:
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      # Only downloads.claude.ai, through runtime-egress's installer proxy on this service's network.
      HTTPS_PROXY: http://runtime-egress-install:3129
      NODE_USE_ENV_PROXY: "1"
    volumes:
      - runtime-tools:/opt/flux-tools:z
    networks: [runtime-install]
    depends_on:
      runtime-egress:
        condition: service_started
    restart: "no"
  runtime-manager:
    # No database and no Docker access. Listens only on runtime-control (its alias there); on the slot
    # networks it only connects out to each supervisor with that slot's secret.
    <<: *runtime-hardening
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["node", "apps/runtime/dist/manager/main.js"]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    environment:
      FLUX_RUNTIME_MANAGER_SECRET: ${FLUX_RUNTIME_MANAGER_SECRET:-}
      FLUX_RUNTIME_SLOT_1: ${FLUX_RUNTIME_SECRET_1:-}
      FLUX_RUNTIME_SLOT_2: ${FLUX_RUNTIME_SECRET_2:-}
      FLUX_RUNTIME_SLOT_3: ${FLUX_RUNTIME_SECRET_3:-}
      FLUX_RUNTIME_SLOT_4: ${FLUX_RUNTIME_SECRET_4:-}
    networks:
      runtime-control:
        aliases: [runtime-manager-control]
      runtime-1: {}
      runtime-2: {}
      runtime-3: {}
      runtime-4: {}
  runtime-egress:
    # The slots' only way out: CONNECT to the enabled CLIs' documented hosts, and the API's /mcp only.
    <<: *runtime-hardening
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["node", "apps/runtime/dist/egress/main.js"]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    environment:
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      FLUX_RUNTIME_EGRESS_API: api:8080
    networks:
      runtime-api: {}
      runtime-egress-out: {}
      runtime-install:
        aliases: [runtime-egress-install]
      runtime-1: {}
      runtime-2: {}
      runtime-3: {}
      runtime-4: {}
  runtime-1:
    <<: *runtime-slot
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
      target: agent-runtime
    environment:
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      FLUX_RUNTIME_SLOT: runtime-1
      FLUX_RUNTIME_SLOT_SECRET: ${FLUX_RUNTIME_SECRET_1:-}
    volumes:
      - runtime-1-data:/data
      - runtime-tools:/opt/flux-tools:ro,z
    networks: [runtime-1]
  runtime-2:
    <<: *runtime-slot
    environment:
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      FLUX_RUNTIME_SLOT: runtime-2
      FLUX_RUNTIME_SLOT_SECRET: ${FLUX_RUNTIME_SECRET_2:-}
    volumes:
      - runtime-2-data:/data
      - runtime-tools:/opt/flux-tools:ro,z
    networks: [runtime-2]
  runtime-3:
    <<: *runtime-slot
    environment:
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      FLUX_RUNTIME_SLOT: runtime-3
      FLUX_RUNTIME_SLOT_SECRET: ${FLUX_RUNTIME_SECRET_3:-}
    volumes:
      - runtime-3-data:/data
      - runtime-tools:/opt/flux-tools:ro,z
    networks: [runtime-3]
  runtime-4:
    <<: *runtime-slot
    environment:
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      FLUX_RUNTIME_SLOT: runtime-4
      FLUX_RUNTIME_SLOT_SECRET: ${FLUX_RUNTIME_SECRET_4:-}
    volumes:
      - runtime-4-data:/data
      - runtime-tools:/opt/flux-tools:ro,z
    networks: [runtime-4]
  mailpit:
    # Local SMTP catcher for development and tests only. Never a production mail relay.
    profiles: ["dev", "test", "ui"]
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - 127.0.0.1:${FLUX_MAILPIT_PORT:-8025}:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20
  test:
    profiles: ["test"]
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
      target: test
    image: flux-test-tools:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["sh", "-c", "exec node_modules/.bin/tsx --test --test-concurrency=1 tests/app/*.test.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
      FLUX_API_URL: http://api:8080
      FLUX_MAILPIT_URL: http://mailpit:8025
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      # In-process notification email checks (#116) use the same SMTP catcher as the worker.
      FLUX_SMTP_URL: ${FLUX_SMTP_URL:-}
      FLUX_MAIL_FROM: ${FLUX_MAIL_FROM:-}
      FLUX_FIXTURE_TOKEN: ${FLUX_FIXTURE_TOKEN:?Set FLUX_FIXTURE_TOKEN}
      # In-process API instances (live admission tests, #128) act as a second replica of the
      # API container and must decrypt the same Better Auth JWKS.
      FLUX_AUTH_SECRET: ${FLUX_AUTH_SECRET:?Set FLUX_AUTH_SECRET}
      FLUX_TEST_STATE_DIR: /state
      FLUX_STREAM_HEARTBEAT_MS: ${FLUX_STREAM_HEARTBEAT_MS:-25000}
    volumes:
      - teststate:/state
      - ${FLUX_BACKGROUND_KEY_HOST_FILE:-./background-key-unavailable}:/run/secrets/flux_background_key:ro,z
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      worker:
        condition: service_started
      mailpit:
        condition: service_healthy
  ui-test:
    # Playwright browser tests against the running app (scripts/check_ui.sh). The browser opens
    # FLUX_PUBLIC_ORIGIN, a loopback address inside this container that is forwarded to the API,
    # so origin checks and cookies behave as they do for a person on the host.
    profiles: ["ui"]
    build:
      context: ../app
      dockerfile: ../docker/ui-tests.Dockerfile
    image: flux-ui-tests:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    environment:
      FLUX_UI_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      FLUX_UI_UPSTREAM: api:8080
      FLUX_MAILPIT_URL: http://mailpit:8025
      FLUX_UI_SCREENSHOTS: /screenshots
      # TEST ONLY (#68): the browser tests script the mock provider's next answers.
      FLUX_ANTHROPIC_MOCK_URL: http://anthropic-mock:8090
      # TEST ONLY (#179): an OpenAI-compatible endpoint for the connection settings form.
      FLUX_OPENAI_MOCK_URL: http://openai-mock:8091
      # TEST ONLY (#287): browser sessions cannot register OAuth clients, so the browser tests
      # register theirs through the integration fixture with this token.
      FLUX_FIXTURE_TOKEN: ${FLUX_FIXTURE_TOKEN:?Set FLUX_FIXTURE_TOKEN}
    volumes:
      # Tests are baked into the image (see docker/ui-tests.Dockerfile). Only the screenshot
      # output is mounted; "z" relabels it for SELinux hosts and is ignored elsewhere.
      - ${FLUX_UI_SCREENSHOT_DIR:-uishots}:/screenshots:z
    depends_on:
      api:
        condition: service_healthy
      # Notifications (#116) are generated by the worker from committed events.
      worker:
        condition: service_started
      mailpit:
        condition: service_healthy
      anthropic-mock:
        condition: service_healthy
      openai-mock:
        condition: service_healthy
  anthropic-mock:
    # TEST ONLY (#68): a local stand-in for the Anthropic Messages and token-counting endpoints,
    # scripted by the browser tests. No real provider is ever called; nothing here is a provider pass.
    profiles: ["ui"]
    image: flux-ui-tests:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["python3", "tests/ui/anthropic_mock.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/__health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
  openai-mock:
    # TEST ONLY (#179): a local OpenAI-compatible endpoint (model list and Chat Completions) for the
    # browser tests of the AI connection settings. No real provider is ever called.
    profiles: ["ui"]
    image: flux-ui-tests:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["python3", "tests/ui/openai_mock.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/__health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
  files:
  teststate:
  uishots:
  # Agent runtime: one volume per slot (owners' CLI logins; never in ./flux backup) and the tools volume.
  runtime-tools:
  runtime-1-data:
  runtime-2-data:
  runtime-3-data:
  runtime-4-data:
networks:
  default: {}
  # API, worker and runtime-manager only; no database.
  runtime-control:
    internal: true
    driver_opts: *runtime-network-opts
  # API and runtime-egress only, for /mcp.
  runtime-api:
    internal: true
    driver_opts: *runtime-network-opts
  # runtime-egress's way to the internet (vendor hosts it allows, checked to be public addresses).
  runtime-egress-out: {}
  # runtime-install and runtime-egress's installer proxy.
  runtime-install:
    internal: true
    driver_opts: *runtime-network-opts
  # One internal network per slot, shared only with runtime-manager and runtime-egress.
  runtime-1:
    internal: true
    driver_opts: *runtime-network-opts
  runtime-2:
    internal: true
    driver_opts: *runtime-network-opts
  runtime-3:
    internal: true
    driver_opts: *runtime-network-opts
  runtime-4:
    internal: true
    driver_opts: *runtime-network-opts
