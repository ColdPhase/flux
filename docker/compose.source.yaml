# Flux's database image (F-042: PostgreSQL 18 with pg_search, docker/database/Dockerfile), shared by the database and the
# backup helper (issue #123).
x-postgres-image: &postgres-image flux-database:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}

# --- The agent runtime (F-022 AIM-3, T3 #278): profile `runtime`, started by ./flux only when the
# operator sets FLUX_AGENT_RUNTIME (empty, the default, is off). No service here, or anywhere in Flux,
# mounts a Docker or Podman socket: one runtime below serves everyone, each person under their own
# user id, and every container setting is static. See docs/operations/agent-runtime.md.
# Internal runtime networks get no address on the host's bridge, so nothing in them reaches the host
# itself either (Docker otherwise gives the bridge the network's gateway address).
x-runtime-network-opts: &runtime-network-opts
  com.docker.network.bridge.inhibit_ipv4: "true"
x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
x-runtime-hardening: &runtime-hardening
  profiles: ["runtime"]
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  logging: *runtime-logging
x-runtime-slot: &runtime-slot
  <<: *runtime-hardening
  image: flux-agent-runtime:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
  # One runtime for everyone (#860). Its supervisor starts as root inside the container, with only these capabilities, to run
  # each person's CLIs under that person's own user id; the CLIs have no capabilities at all. FLUX_RUNTIME_MEMORY bounds all the
  # agents together, and how many run at once follows from it (./flux sets it from the server's memory).
  user: "0:0"
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
  mem_limit: ${FLUX_RUNTIME_MEMORY:-2560m}
  memswap_limit: ${FLUX_RUNTIME_MEMORY:-2560m}
  cpus: ${FLUX_RUNTIME_CPUS:-1}
  pids_limit: 2048
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    # Shared memory would outlive a person and reach the next one with that user id: nobody can write here.
    - /dev/shm:ro,nosuid,nodev,noexec,size=4k
    # Each run's scratch (#1437, RT-5): /scratch/<run id>, the only place a run's own tools write, deleted after the run. Memory,
    # counted in the runtime's limit; only what runs write here uses any.
    - /scratch:rw,nosuid,nodev,size=1g,mode=0711
  restart: unless-stopped
  # The supervisor marks itself ready once it listens. A runtime that refuses to start (an unmet host requirement) stays up
  # without listening: this stays red, so `./flux up` fails, and there is no restart loop (#860).
  healthcheck:
    test: ["CMD", "test", "-f", "/tmp/.flux-runtime-ready"]
    interval: 30s
    timeout: 3s
    retries: 1
    start_period: 20s
    start_interval: 2s
  depends_on:
    runtime-install:
      condition: service_completed_successfully
    runtime-egress:
      condition: service_started

services:
  db:
    build:
      context: database
    image: *postgres-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-flux}
    # Memory equal to memory+swap, like the other services. With the defaults here the base stack's limits add up to
    # under 3 GiB, so it fits a 4 GB host with room for the system (#862).
    mem_limit: ${FLUX_DB_MEMORY:-768m}
    memswap_limit: ${FLUX_DB_MEMORY:-768m}
    volumes:
      - pgdata:/var/lib/postgresql
    # Cheap probes (#862): a probe is an `exec` into the container, so it runs rarely. During the first minute it runs every
    # quarter second, so a start does not wait for an interval and a slow first start (initdb, a big migration) is not counted as failing.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 250ms
  migrate:
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
      labels:
        # Recorded in backup manifests (issue #123); ./flux sets it from `git rev-parse HEAD`.
        com.flux.commit: ${FLUX_GIT_COMMIT:-unknown}
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["node", "tooling/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  files-init:
    profiles: ["setup"]
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/data/files"]
    volumes:
      - files:/data/files:z
    restart: "no"
  files-archive:
    # One-shot helper of ./flux backup and restore (issue #123): streams the files volume as a
    # tar archive over stdin/stdout. The pinned PostgreSQL image is used because it is always
    # present with the database and provides tar, gzip and sha256sum. No network, no ports.
    profiles: ["ops"]
    image: *postgres-image
    user: "0:0"
    network_mode: none
    volumes:
      - files:/data/files:z
    restart: "no"
  api:
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
      FLUX_FIXTURE_TOKEN: ${FLUX_FIXTURE_TOKEN:?Set FLUX_FIXTURE_TOKEN}
      FLUX_TEST_FAILURE_INJECTION: ${FLUX_TEST_FAILURE_INJECTION:-false}
      # TEST ONLY (#979): a test stack's enforced Content-Security-Policy allows eval for the browser test driver; `false` sends the policy that ships.
      FLUX_TEST_CSP_EVAL: ${FLUX_TEST_CSP_EVAL:-true}
      # TEST ONLY (#68): fixture key connections for personal runs; empty in production.
      FLUX_TEST_PERSONAL_RUNS: ${FLUX_TEST_PERSONAL_RUNS:-}
      FLUX_FILES_DIR: /data/files
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      FLUX_AUTH_SECRET: ${FLUX_AUTH_SECRET:?Set FLUX_AUTH_SECRET}
      FLUX_TRUSTED_PROXIES: ${FLUX_TRUSTED_PROXIES:-}
      FLUX_SMTP_URL: ${FLUX_SMTP_URL:-}
      FLUX_MAIL_FROM: ${FLUX_MAIL_FROM:-}
      FLUX_PASSWORD_RESET_TTL_SECONDS: ${FLUX_PASSWORD_RESET_TTL_SECONDS:-3600}
      # How long a session lasts unused, and the longest it lasts from sign-in (#993), such as 30m, 12h or 7d; empty is 7d and 30d.
      FLUX_SESSION_IDLE: ${FLUX_SESSION_IDLE:-}
      FLUX_SESSION_MAX_AGE: ${FLUX_SESSION_MAX_AGE:-}
      # Optional single sign-on (#113): issuer and client id switch it on; the secret is a file.
      FLUX_OIDC_ISSUER: ${FLUX_OIDC_ISSUER:-}
      FLUX_OIDC_CLIENT_ID: ${FLUX_OIDC_CLIENT_ID:-}
      FLUX_OIDC_CLIENT_SECRET_FILE: /run/secrets/flux_oidc_client_secret
      FLUX_OIDC_LABEL: ${FLUX_OIDC_LABEL:-}
      FLUX_SSO_MODE: ${FLUX_SSO_MODE:-sso}
      # How long the provider's last confirmation of a person keeps their access, 1h to 30d (F-024 S2); empty is 7d.
      FLUX_OIDC_CONFIRMATION_MAX_AGE: ${FLUX_OIDC_CONFIRMATION_MAX_AGE:-}
      # Standing check of the person's account at the provider (F-024 S4, #311).
      FLUX_OIDC_STANDING: ${FLUX_OIDC_STANDING:-refresh}
      FLUX_OIDC_STANDING_INTERVAL_SECONDS: ${FLUX_OIDC_STANDING_INTERVAL_SECONDS:-900}
      FLUX_AUTH_RATE_LIMIT: ${FLUX_AUTH_RATE_LIMIT:-true}
      # The setup link's token (#1471): the first account, the company's owner, comes from <origin>/setup#<token>; every other one from
      # an invite link or single sign-on. ./flux up writes it; once the company exists it does nothing.
      FLUX_SETUP_TOKEN: ${FLUX_SETUP_TOKEN:-}
      # Web Push (issue #41). The API only needs the public key; empty reports push unavailable.
      FLUX_VAPID_PUBLIC_KEY: ${FLUX_VAPID_PUBLIC_KEY:-}
      FLUX_STREAM_HEARTBEAT_MS: ${FLUX_STREAM_HEARTBEAT_MS:-25000}
      FLUX_LIVE_EDITING: ${FLUX_LIVE_EDITING:-on}
      # Owner AI connections (#179, F-020): private targets an OpenAI-compatible endpoint may reach.
      # Empty allows public HTTPS endpoints only. See docs/development/containers.md.
      FLUX_AI_PRIVATE_TARGETS: ${FLUX_AI_PRIVATE_TARGETS:-}
      # Link cards (#469): `on` lets the server fetch the title and description of a link in a message. Empty or `off` fetches nothing.
      FLUX_LINK_PREVIEWS: ${FLUX_LINK_PREVIEWS:-off}
      # The most MiB one video may be (C-61, #1352); other files stay at 5 MiB.
      FLUX_VIDEO_MAX_MIB: ${FLUX_VIDEO_MAX_MIB:-200}
      # Agents reading and searching the web (#918, #954, C-29): on by default; `off` gives no agent flux_read_web or its provider's web search.
      FLUX_WEB_READS: ${FLUX_WEB_READS:-on}
      # TEST ONLY (#469): public-looking names that connect to a mock; refused unless FLUX_TEST_FAILURE_INJECTION=true.
      FLUX_TEST_LINK_PREVIEW_HOSTS: ${FLUX_TEST_LINK_PREVIEW_HOSTS:-}
      # TEST ONLY (#1218): the mock that answers Anthropic, OpenAI and Gemini key listings; refused unless FLUX_TEST_FAILURE_INJECTION=true.
      FLUX_TEST_PROVIDER_LISTS: ${FLUX_TEST_PROVIDER_LISTS:-}
      FLUX_PERSONAL_RUNS: ${FLUX_PERSONAL_RUNS:-}
      # GitHub App read-only integration (#74). Empty reports unavailable; configure all together.
      FLUX_GITHUB_CLIENT_ID: ${FLUX_GITHUB_CLIENT_ID:-}
      FLUX_GITHUB_CLIENT_SECRET: ${FLUX_GITHUB_CLIENT_SECRET:-}
      FLUX_GITHUB_APP_ID: ${FLUX_GITHUB_APP_ID:-}
      FLUX_GITHUB_APP_SLUG: ${FLUX_GITHUB_APP_SLUG:-}
      FLUX_GITHUB_WEBHOOK_SECRET: ${FLUX_GITHUB_WEBHOOK_SECRET:-}
      FLUX_GITHUB_DELIVERY: ${FLUX_GITHUB_DELIVERY:-webhook}
      FLUX_GITHUB_ENCRYPTION_KEY: ${FLUX_GITHUB_ENCRYPTION_KEY:-}
      # The agent runtime (F-022 AIM-3): empty is off. See docs/operations/agent-runtime.md.
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      FLUX_AGENT_RUNTIME_COMMERCIAL_TERMS: ${FLUX_AGENT_RUNTIME_COMMERCIAL_TERMS:-}
      FLUX_AGENT_RUNTIME_IDLE_DAYS: ${FLUX_AGENT_RUNTIME_IDLE_DAYS:-}
      # Written by ./flux up when the host cannot run the agent runtime (#1438): Settings › AI says why in one line.
      FLUX_AGENT_RUNTIME_OFF_REASON: ${FLUX_AGENT_RUNTIME_OFF_REASON:-}
      FLUX_RUNTIME_MANAGER_SECRET: ${FLUX_RUNTIME_MANAGER_SECRET:-}
      # Encrypted workspaces (F-030): the keyring on the internal `keyring` network; FLUX_KEYRING=off disables it
      # (every encrypted workspace then stays locked). See docs/product/encrypted-workspaces.md.
      FLUX_KEYRING: ${FLUX_KEYRING:-on}
      FLUX_KEYRING_TOKEN: ${FLUX_KEYRING_TOKEN:-}
      FLUX_KEY_PIN_SECRET: ${FLUX_KEY_PIN_SECRET:-}
      FLUX_SWAP_ACKNOWLEDGED: ${FLUX_SWAP_ACKNOWLEDGED:-}
      PORT: 8080
    # Memory equal to memory+swap: this container cannot page keys or content to a swap device (F-030).
    mem_limit: ${FLUX_API_MEMORY:-1536m}
    memswap_limit: ${FLUX_API_MEMORY:-1536m}
    ulimits:
      core: 0
    # `keyring` holds only api, worker and keyring. With the agent runtime on, compose.source.runtime.yaml adds
    # runtime-control and runtime-api (#744: a project without the runtime takes two address pools, not four).
    networks: [default, keyring]
    volumes:
      - files:/data/files:z
      # Optional 32-byte operator secret; empty tracked placeholder means unavailable.
      - ${FLUX_BACKGROUND_KEY_HOST_FILE:-./background-key-unavailable}:/run/secrets/flux_background_key:ro,z
      # Optional single sign-on client secret (#113); the empty placeholder is unused while sign-on is off.
      - ${FLUX_OIDC_CLIENT_SECRET_HOST_FILE:-./oidc-client-secret-unavailable}:/run/secrets/flux_oidc_client_secret:ro,z
    ports:
      - 127.0.0.1:${FLUX_PORT:-8081}:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
      keyring:
        condition: service_started
    # `wget` of the image's busybox, not a Node process: starting Node costs about 70 ms of CPU per probe (#862). `-Y off`: a proxy variable of the
    # environment must not send the loopback probe elsewhere.
    healthcheck:
      test: ["CMD", "wget", "-q", "-Y", "off", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 250ms
  worker:
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    restart: unless-stopped
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
      # Notification email (#116) uses the instance SMTP transport and links to the public origin.
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      FLUX_SMTP_URL: ${FLUX_SMTP_URL:-}
      FLUX_MAIL_FROM: ${FLUX_MAIL_FROM:-}
      # The worker signs Web Push requests. Set both keys or neither; the contact is optional (empty: the https FLUX_PUBLIC_ORIGIN).
      FLUX_VAPID_PUBLIC_KEY: ${FLUX_VAPID_PUBLIC_KEY:-}
      FLUX_VAPID_PRIVATE_KEY: ${FLUX_VAPID_PRIVATE_KEY:-}
      FLUX_VAPID_SUBJECT: ${FLUX_VAPID_SUBJECT:-}
      # TEST ONLY (#68): with FLUX_TEST_PERSONAL_RUNS=anthropic-mock the worker sends personal runs
      # through the real Anthropic adapter to this mock provider. Empty in production.
      FLUX_TEST_FAILURE_INJECTION: ${FLUX_TEST_FAILURE_INJECTION:-false}
      # With the line above, marks a test deployment (F-030 test-only swap files); empty in production.
      FLUX_FIXTURE_TOKEN: ${FLUX_FIXTURE_TOKEN:-}
      FLUX_TEST_PERSONAL_RUNS: ${FLUX_TEST_PERSONAL_RUNS:-}
      FLUX_TEST_ANTHROPIC_URL: ${FLUX_TEST_ANTHROPIC_URL:-}
      # TEST ONLY (#1218): the same key-listing mock as the API.
      FLUX_TEST_PROVIDER_LISTS: ${FLUX_TEST_PROVIDER_LISTS:-}
      # The same operator allowlist as the API: the worker checks it again at every request.
      FLUX_AI_PRIVATE_TARGETS: ${FLUX_AI_PRIVATE_TARGETS:-}
      FLUX_PERSONAL_RUNS: ${FLUX_PERSONAL_RUNS:-}
      # The same web switch as the API (#954): `off` offers no run its provider's web search.
      FLUX_WEB_READS: ${FLUX_WEB_READS:-on}
      # The agent runtime (F-022 AIM-3): the worker reconciles slot bindings through runtime-manager.
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      FLUX_AGENT_RUNTIME_COMMERCIAL_TERMS: ${FLUX_AGENT_RUNTIME_COMMERCIAL_TERMS:-}
      FLUX_AGENT_RUNTIME_IDLE_DAYS: ${FLUX_AGENT_RUNTIME_IDLE_DAYS:-}
      FLUX_RUNTIME_MANAGER_SECRET: ${FLUX_RUNTIME_MANAGER_SECRET:-}
      FLUX_KEYRING: ${FLUX_KEYRING:-on}
      FLUX_KEYRING_TOKEN: ${FLUX_KEYRING_TOKEN:-}
      FLUX_KEY_PIN_SECRET: ${FLUX_KEY_PIN_SECRET:-}
      FLUX_SWAP_ACKNOWLEDGED: ${FLUX_SWAP_ACKNOWLEDGED:-}
    mem_limit: ${FLUX_WORKER_MEMORY:-512m}
    memswap_limit: ${FLUX_WORKER_MEMORY:-512m}
    ulimits:
      core: 0
    # runtime-control comes from compose.source.runtime.yaml when the agent runtime is on.
    networks: [default, keyring]
    volumes:
      - files:/data/files:z
      - ${FLUX_BACKGROUND_KEY_HOST_FILE:-./background-key-unavailable}:/run/secrets/flux_background_key:ro,z
    depends_on:
      migrate:
        condition: service_completed_successfully
  # Encrypted workspaces (F-030, #655): one boot key in RAM, nothing on disk. Plain HTTP on the internal `keyring`
  # network of this one Docker host, behind FLUX_KEYRING_TOKEN; exactly one per deployment. It refuses to start where
  # its memory could be paged to disk. Without a token it stays idle and every encrypted workspace is locked.
  keyring:
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["node", "apps/keyring/dist/main.js"]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    ulimits:
      core: 0
    mem_limit: ${FLUX_KEYRING_MEMORY:-128m}
    memswap_limit: ${FLUX_KEYRING_MEMORY:-128m}
    pids_limit: 32
    environment:
      FLUX_KEYRING_TOKEN: ${FLUX_KEYRING_TOKEN:-}
      FLUX_SWAP_ACKNOWLEDGED: ${FLUX_SWAP_ACKNOWLEDGED:-}
      NODE_OPTIONS: --secure-heap=65536
      # TEST ONLY switches; both needed (with FLUX_KEYRING_REVEAL_BOOT_KEY for the boot-key reveal) or ignored.
      FLUX_FIXTURE_TOKEN: ${FLUX_FIXTURE_TOKEN:-}
      FLUX_TEST_FAILURE_INJECTION: ${FLUX_TEST_FAILURE_INJECTION:-false}
      FLUX_KEYRING_REVEAL_BOOT_KEY: ${FLUX_KEYRING_REVEAL_BOOT_KEY:-}
    networks: [keyring]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The shell and `nc` of the image's busybox, not a Node process (#862). The token goes through the pipe, never an argument,
    # so no process list shows it. Without a token the keyring is idle and healthy; with one, `/v1/boot` must answer 200.
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$FLUX_KEYRING_TOKEN\" ] || { printf 'GET /v1/boot HTTP/1.0\\r\\nAuthorization: Bearer %s\\r\\n\\r\\n' \"$$FLUX_KEYRING_TOKEN\" | nc -w 3 127.0.0.1 8090 | head -n 1 | grep -q ' 200 '; }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 250ms
  # --- Agent runtime services (profile `runtime`; see the x-runtime-* blocks at the top).
  runtime-install:
    # One-shot: installs the pinned, signature-checked Claude Code into the tools volume when
    # FLUX_AGENT_RUNTIME includes claude_code (Flux never ships it in an image); otherwise a no-op.
    <<: *runtime-hardening
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
      target: agent-runtime-install
    image: flux-agent-runtime-install:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["node", "apps/runtime/dist/install/main.js"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    environment:
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      # Only downloads.claude.ai, through runtime-egress's installer proxy on this service's network.
      HTTPS_PROXY: http://runtime-egress-install:3129
      NODE_USE_ENV_PROXY: "1"
    volumes:
      - runtime-tools:/opt/flux-tools:z
    networks: [runtime-install]
    depends_on:
      runtime-egress:
        condition: service_started
    restart: "no"
  runtime-manager:
    # No database and no Docker access. Listens only on runtime-control (its alias there); on the slot
    # networks it only connects out to each supervisor with that slot's secret.
    <<: *runtime-hardening
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["node", "apps/runtime/dist/manager/main.js"]
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    environment:
      FLUX_RUNTIME_MANAGER_SECRET: ${FLUX_RUNTIME_MANAGER_SECRET:-}
      FLUX_RUNTIME_SLOT_1: ${FLUX_RUNTIME_SECRET_1:-}
    networks:
      runtime-control:
        aliases: [runtime-manager-control]
      runtime-1: {}
  runtime-egress:
    # The runtime's only way out: CONNECT to the enabled CLIs' documented hosts, the API's /mcp only, and the
    # providers' model paths only, to the worker's model gateway (#1441), which alone holds API keys.
    <<: *runtime-hardening
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["node", "apps/runtime/dist/egress/main.js"]
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    environment:
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      FLUX_RUNTIME_EGRESS_API: api:8080
      FLUX_RUNTIME_EGRESS_GATEWAY: worker-gateway:8095
    networks:
      runtime-api: {}
      runtime-egress-out: {}
      runtime-install:
        aliases: [runtime-egress-install]
      runtime-1: {}
  runtime-1:
    <<: *runtime-slot
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
      target: agent-runtime
    environment:
      FLUX_AGENT_RUNTIME: ${FLUX_AGENT_RUNTIME:-}
      FLUX_RUNTIME_SLOT: runtime-1
      FLUX_RUNTIME_SLOT_SECRET: ${FLUX_RUNTIME_SECRET_1:-}
      FLUX_RUNTIME_MAX_RUNS: ${FLUX_RUNTIME_MAX_RUNS:-}
    volumes:
      - runtime-1-data:/data
      - runtime-tools:/opt/flux-tools:ro,z
    networks: [runtime-1]
  mailpit:
    # Local SMTP catcher for development and tests only. Never a production mail relay.
    profiles: ["dev", "test", "ui"]
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - 127.0.0.1:${FLUX_MAILPIT_PORT:-8025}:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20
  test:
    profiles: ["test"]
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
      target: test
    image: flux-test-tools:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["sh", "-c", "exec node_modules/.bin/tsx --test --test-concurrency=1 tests/app/*.test.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
      FLUX_API_URL: http://api:8080
      FLUX_MAILPIT_URL: http://mailpit:8025
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      # In-process notification email checks (#116) use the same SMTP catcher as the worker.
      FLUX_SMTP_URL: ${FLUX_SMTP_URL:-}
      FLUX_MAIL_FROM: ${FLUX_MAIL_FROM:-}
      FLUX_FIXTURE_TOKEN: ${FLUX_FIXTURE_TOKEN:?Set FLUX_FIXTURE_TOKEN}
      # In-process API instances (live admission tests, #128) act as a second replica of the
      # API container and must decrypt the same Better Auth JWKS.
      FLUX_AUTH_SECRET: ${FLUX_AUTH_SECRET:?Set FLUX_AUTH_SECRET}
      FLUX_TEST_STATE_DIR: /state
      FLUX_LIVE_EDITING: ${FLUX_LIVE_EDITING:-on}
      FLUX_STREAM_HEARTBEAT_MS: ${FLUX_STREAM_HEARTBEAT_MS:-25000}
    volumes:
      - teststate:/state
      - ${FLUX_BACKGROUND_KEY_HOST_FILE:-./background-key-unavailable}:/run/secrets/flux_background_key:ro,z
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      worker:
        condition: service_started
      mailpit:
        condition: service_healthy
  ui-test:
    # Playwright browser tests against the running app (scripts/check_ui.sh). The browser opens
    # FLUX_PUBLIC_ORIGIN, a loopback address inside this container that is forwarded to the API,
    # so origin checks and cookies behave as they do for a person on the host.
    profiles: ["ui"]
    build:
      context: ../app
      dockerfile: ../docker/ui-tests.Dockerfile
    image: flux-ui-tests:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    environment:
      FLUX_UI_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      FLUX_UI_UPSTREAM: api:8080
      FLUX_MAILPIT_URL: http://mailpit:8025
      FLUX_UI_SCREENSHOTS: /screenshots
      # The opt-in motion_performance harness's sample sizes (app/tests/ui/motion_performance.py); its defaults are the agreed method.
      FLUX_MOTION_WARMUPS: ${FLUX_MOTION_WARMUPS:-30}
      FLUX_MOTION_SAMPLES: ${FLUX_MOTION_SAMPLES:-200}
      FLUX_MOTION_SECONDS: ${FLUX_MOTION_SECONDS:-60}
      FLUX_MOTION_LAYOUT_WARMUPS: ${FLUX_MOTION_LAYOUT_WARMUPS:-15}
      FLUX_MOTION_LAYOUT_SAMPLES: ${FLUX_MOTION_LAYOUT_SAMPLES:-100}
      FLUX_LIVE_EDITING: ${FLUX_LIVE_EDITING:-on}
      FLUX_LIVE_EDITING_TEST: ${FLUX_LIVE_EDITING_TEST:-0}
      # TEST ONLY (#68): the browser tests script the mock provider's next answers.
      FLUX_ANTHROPIC_MOCK_URL: http://anthropic-mock:8090
      # TEST ONLY (#179): an OpenAI-compatible endpoint for the connection settings form.
      FLUX_OPENAI_MOCK_URL: http://openai-mock:8091
      # TEST ONLY (#469): the page a link card is fetched from (public.test in the API's FLUX_TEST_LINK_PREVIEW_HOSTS).
      FLUX_LINK_MOCK_URL: http://link-mock:8098
      # TEST ONLY (#287): browser sessions cannot register OAuth clients, so the browser tests
      # register theirs through the integration fixture with this token.
      FLUX_FIXTURE_TOKEN: ${FLUX_FIXTURE_TOKEN:?Set FLUX_FIXTURE_TOKEN}
    volumes:
      # Tests are baked into the image (see docker/ui-tests.Dockerfile). Only the screenshot
      # output is mounted; "z" relabels it for SELinux hosts and is ignored elsewhere.
      - ${FLUX_UI_SCREENSHOT_DIR:-uishots}:/screenshots:z
    depends_on:
      api:
        condition: service_healthy
      # Notifications (#116) are generated by the worker from committed events.
      worker:
        condition: service_started
      mailpit:
        condition: service_healthy
      anthropic-mock:
        condition: service_healthy
      openai-mock:
        condition: service_healthy
      link-mock:
        condition: service_healthy
  anthropic-mock:
    # TEST ONLY (#68): a local stand-in for the Anthropic Messages and token-counting endpoints,
    # scripted by the browser tests. No real provider is ever called; nothing here is a provider pass.
    profiles: ["ui"]
    image: flux-ui-tests:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["python3", "tests/ui/anthropic_mock.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/__health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
  openai-mock:
    # TEST ONLY (#179): a local OpenAI-compatible endpoint (model list and Chat Completions) for the
    # browser tests of the AI connection settings. No real provider is ever called.
    profiles: ["ui"]
    image: flux-ui-tests:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["python3", "tests/ui/openai_mock.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/__health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
  link-mock:
    # TEST ONLY (#469): pages for the link card tests, reached by the API as public.test. No real site is ever fetched.
    profiles: ["ui"]
    image: flux-ui-tests:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["python3", "tests/ui/link_mock.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/__health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
  files:
  teststate:
  uishots:
  # Agent runtime: people's CLI logins (never in ./flux backup) and the tools volume.
  runtime-tools:
  runtime-1-data:
networks:
  default: {}
  # api, worker and keyring only (F-030): DEKs cross it, and it never leaves this host's kernel.
  keyring:
    internal: true
    driver_opts: *runtime-network-opts
  # API, worker and runtime-manager only; no database.
  runtime-control:
    internal: true
    driver_opts: *runtime-network-opts
  # API, worker and runtime-egress only: /mcp on the API, the model gateway on the worker (#1441).
  runtime-api:
    internal: true
    driver_opts: *runtime-network-opts
  # runtime-egress's way to the internet (vendor hosts it allows, checked to be public addresses).
  runtime-egress-out: {}
  # runtime-install and runtime-egress's installer proxy.
  runtime-install:
    internal: true
    driver_opts: *runtime-network-opts
  # The runtime's internal network, shared only with runtime-manager and runtime-egress.
  runtime-1:
    internal: true
    driver_opts: *runtime-network-opts
