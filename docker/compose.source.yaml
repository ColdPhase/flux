# The pinned PostgreSQL image, shared by the database and the backup helper (issue #123).
x-postgres-image: &postgres-image postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873

services:
  db:
    image: *postgres-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-flux}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 20
  migrate:
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
      labels:
        # Recorded in backup manifests (issue #123); ./flux sets it from `git rev-parse HEAD`.
        com.flux.commit: ${FLUX_GIT_COMMIT:-unknown}
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["node", "tooling/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  files-init:
    profiles: ["setup"]
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/data/files"]
    volumes:
      - files:/data/files:z
    restart: "no"
  files-archive:
    # One-shot helper of ./flux backup and restore (issue #123): streams the files volume as a
    # tar archive over stdin/stdout. The pinned PostgreSQL image is used because it is always
    # present with the database and provides tar, gzip and sha256sum. No network, no ports.
    profiles: ["ops"]
    image: *postgres-image
    user: "0:0"
    network_mode: none
    volumes:
      - files:/data/files:z
    restart: "no"
  api:
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
      FLUX_FIXTURE_TOKEN: ${FLUX_FIXTURE_TOKEN:?Set FLUX_FIXTURE_TOKEN}
      FLUX_TEST_FAILURE_INJECTION: ${FLUX_TEST_FAILURE_INJECTION:-false}
      # TEST ONLY (#68): fixture key connections for personal runs; empty in production.
      FLUX_TEST_PERSONAL_RUNS: ${FLUX_TEST_PERSONAL_RUNS:-}
      FLUX_FILES_DIR: /data/files
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      FLUX_AUTH_SECRET: ${FLUX_AUTH_SECRET:?Set FLUX_AUTH_SECRET}
      FLUX_TRUSTED_PROXIES: ${FLUX_TRUSTED_PROXIES:-}
      FLUX_SMTP_URL: ${FLUX_SMTP_URL:-}
      FLUX_MAIL_FROM: ${FLUX_MAIL_FROM:-}
      FLUX_PASSWORD_RESET_TTL_SECONDS: ${FLUX_PASSWORD_RESET_TTL_SECONDS:-3600}
      FLUX_AUTH_RATE_LIMIT: ${FLUX_AUTH_RATE_LIMIT:-true}
      # Web Push (issue #41). The API only needs the public key; empty reports push unavailable.
      FLUX_VAPID_PUBLIC_KEY: ${FLUX_VAPID_PUBLIC_KEY:-}
      FLUX_STREAM_HEARTBEAT_MS: ${FLUX_STREAM_HEARTBEAT_MS:-25000}
      # GitHub App read-only integration (#74). Empty reports unavailable; configure all together.
      FLUX_GITHUB_CLIENT_ID: ${FLUX_GITHUB_CLIENT_ID:-}
      FLUX_GITHUB_CLIENT_SECRET: ${FLUX_GITHUB_CLIENT_SECRET:-}
      FLUX_GITHUB_APP_ID: ${FLUX_GITHUB_APP_ID:-}
      FLUX_GITHUB_APP_SLUG: ${FLUX_GITHUB_APP_SLUG:-}
      FLUX_GITHUB_WEBHOOK_SECRET: ${FLUX_GITHUB_WEBHOOK_SECRET:-}
      FLUX_GITHUB_ENCRYPTION_KEY: ${FLUX_GITHUB_ENCRYPTION_KEY:-}
      PORT: 8080
    volumes:
      - files:/data/files:z
      # Optional 32-byte operator secret; empty tracked placeholder means unavailable.
      - ${FLUX_BACKGROUND_KEY_HOST_FILE:-./background-key-unavailable}:/run/secrets/flux_background_key:ro,z
    ports:
      - 127.0.0.1:${FLUX_PORT:-8081}:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20
  worker:
    image: flux-foundation:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    restart: unless-stopped
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
      # Notification email (#116) uses the instance SMTP transport and links to the public origin.
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      FLUX_SMTP_URL: ${FLUX_SMTP_URL:-}
      FLUX_MAIL_FROM: ${FLUX_MAIL_FROM:-}
      # The worker signs Web Push requests. Set all three or none.
      FLUX_VAPID_PUBLIC_KEY: ${FLUX_VAPID_PUBLIC_KEY:-}
      FLUX_VAPID_PRIVATE_KEY: ${FLUX_VAPID_PRIVATE_KEY:-}
      FLUX_VAPID_SUBJECT: ${FLUX_VAPID_SUBJECT:-}
      # TEST ONLY (#68): with FLUX_TEST_PERSONAL_RUNS=anthropic-mock the worker sends personal runs
      # through the real Anthropic adapter to this mock provider. Empty in production.
      FLUX_TEST_FAILURE_INJECTION: ${FLUX_TEST_FAILURE_INJECTION:-false}
      FLUX_TEST_PERSONAL_RUNS: ${FLUX_TEST_PERSONAL_RUNS:-}
      FLUX_TEST_ANTHROPIC_URL: ${FLUX_TEST_ANTHROPIC_URL:-}
    volumes:
      - files:/data/files:z
      - ${FLUX_BACKGROUND_KEY_HOST_FILE:-./background-key-unavailable}:/run/secrets/flux_background_key:ro,z
    depends_on:
      migrate:
        condition: service_completed_successfully
  mailpit:
    # Local SMTP catcher for development and tests only. Never a production mail relay.
    profiles: ["dev", "test", "ui"]
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - 127.0.0.1:${FLUX_MAILPIT_PORT:-8025}:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20
  test:
    profiles: ["test"]
    build:
      context: ../app
      dockerfile: ../docker/Dockerfile
      target: test
    image: flux-test-tools:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["pnpm", "test"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flux}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flux}
      FLUX_API_URL: http://api:8080
      FLUX_MAILPIT_URL: http://mailpit:8025
      FLUX_PUBLIC_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      # In-process notification email checks (#116) use the same SMTP catcher as the worker.
      FLUX_SMTP_URL: ${FLUX_SMTP_URL:-}
      FLUX_MAIL_FROM: ${FLUX_MAIL_FROM:-}
      FLUX_FIXTURE_TOKEN: ${FLUX_FIXTURE_TOKEN:?Set FLUX_FIXTURE_TOKEN}
      # In-process API instances (live admission tests, #128) act as a second replica of the
      # API container and must decrypt the same Better Auth JWKS.
      FLUX_AUTH_SECRET: ${FLUX_AUTH_SECRET:?Set FLUX_AUTH_SECRET}
      FLUX_TEST_STATE_DIR: /state
      FLUX_STREAM_HEARTBEAT_MS: ${FLUX_STREAM_HEARTBEAT_MS:-25000}
    volumes:
      - teststate:/state
      - ${FLUX_BACKGROUND_KEY_HOST_FILE:-./background-key-unavailable}:/run/secrets/flux_background_key:ro,z
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      worker:
        condition: service_started
      mailpit:
        condition: service_healthy
  ui-test:
    # Playwright browser tests against the running app (scripts/check_ui.sh). The browser opens
    # FLUX_PUBLIC_ORIGIN, a loopback address inside this container that is forwarded to the API,
    # so origin checks and cookies behave as they do for a person on the host.
    profiles: ["ui"]
    build:
      context: ../app
      dockerfile: ../docker/ui-tests.Dockerfile
    image: flux-ui-tests:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    environment:
      FLUX_UI_ORIGIN: ${FLUX_PUBLIC_ORIGIN:?Set FLUX_PUBLIC_ORIGIN}
      FLUX_UI_UPSTREAM: api:8080
      FLUX_MAILPIT_URL: http://mailpit:8025
      FLUX_UI_SCREENSHOTS: /screenshots
      # TEST ONLY (#68): the browser tests script the mock provider's next answers.
      FLUX_ANTHROPIC_MOCK_URL: http://anthropic-mock:8090
    volumes:
      # Tests are baked into the image (see docker/ui-tests.Dockerfile). Only the screenshot
      # output is mounted; "z" relabels it for SELinux hosts and is ignored elsewhere.
      - ${FLUX_UI_SCREENSHOT_DIR:-uishots}:/screenshots:z
    depends_on:
      api:
        condition: service_healthy
      # Notifications (#116) are generated by the worker from committed events.
      worker:
        condition: service_started
      mailpit:
        condition: service_healthy
      anthropic-mock:
        condition: service_healthy
  anthropic-mock:
    # TEST ONLY (#68): a local stand-in for the Anthropic Messages and token-counting endpoints,
    # scripted by the browser tests. No real provider is ever called; nothing here is a provider pass.
    profiles: ["ui"]
    image: flux-ui-tests:${FLUX_IMAGE_TAG:-${COMPOSE_PROJECT_NAME:-local}}
    command: ["python3", "tests/ui/anthropic_mock.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/__health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
  files:
  teststate:
  uishots:
