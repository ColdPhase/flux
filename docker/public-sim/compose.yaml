# Simulated public self-hosted install (#63, founder direction 2026-10-30). Layer after
# Relative paths resolve against docker/ (the directory of the first Compose file).
# compose.source.yaml, compose.live.yaml and compose.live.turn.yaml exactly as an operator does;
# scripts/check_public_sim.sh starts it. Local test infrastructure only: never deploy this file.
#
#   lan-a (10.213.1.0/24) -- router-a (NAT, restrictive: TCP/443 + DNS only) --+
#   lan-b (10.213.2.0/24) -- router-b (NAT, open)                           --+-- internet (203.0.113.0/24)
#                                                                               |   dns     203.0.113.53
#                                                                               |   proxy   203.0.113.10 flux.sim.test :443
#                                                                               |   livekit 203.0.113.20 turn.sim.test :443/tcp TURN/TLS, :3478/udp, ICE 7881/7882
#                                                                               |   driver  203.0.113.200 (reaches clients only via the routers' TCP/3000)
#   proxy-net (10.213.0.0/24): proxy 10.213.0.10 -> api:8080
x-sim-image: &infra flux-public-sim-infra:${FLUX_IMAGE_TAG:?}
x-sim-client: &client flux-public-sim-client:${FLUX_IMAGE_TAG:?}
services:
  api:
    networks: [default, keyring, livekit-signal, proxy-net]
  livekit:
    # The operator's TURN overlay publishes host ports; here the container itself holds the public address.
    ports: !reset []
    networks:
      internet:
        ipv4_address: 203.0.113.20
  dns:
    image: *infra
    build: { context: ./public-sim, dockerfile: infra.Dockerfile }
    command: ["dnsmasq", "-k", "--conf-file=/etc/flux-sim/dnsmasq.conf", "--log-facility=-"]
    volumes:
      - ./public-sim/dnsmasq.conf:/etc/flux-sim/dnsmasq.conf:ro,z
    networks:
      internet: { ipv4_address: 203.0.113.53 }
  proxy:
    image: caddy:2.11.7-alpine
    volumes:
      - ./public-sim/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ${FLUX_SIM_CERT_DIR:?}:/certs:ro,z
    depends_on:
      api: { condition: service_healthy }
    networks:
      internet: { ipv4_address: 203.0.113.10 }
      proxy-net: { ipv4_address: 10.213.0.10 }
  router-a:
    image: *infra
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: "1" }
    volumes:
      - ./public-sim/router.sh:/router.sh:ro,z
      - ./public-sim/impair.sh:/impair.sh:ro,z
    command: ["/bin/sh", "/router.sh", "10.213.1.10", "${FLUX_SIM_PROFILE_A:-restrictive}"]
    networks:
      internet: { ipv4_address: 203.0.113.101 }
      lan-a: { ipv4_address: 10.213.1.2 }
  router-b:
    image: *infra
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: "1" }
    volumes:
      - ./public-sim/router.sh:/router.sh:ro,z
      - ./public-sim/impair.sh:/impair.sh:ro,z
    command: ["/bin/sh", "/router.sh", "10.213.2.10", "${FLUX_SIM_PROFILE_B:-open}"]
    networks:
      internet: { ipv4_address: 203.0.113.102 }
      lan-b: { ipv4_address: 10.213.2.2 }
  client-a:
    image: *client
    build: { context: ../app/tests/ui, dockerfile: ../../../docker/public-sim/client.Dockerfile }
    cap_add: [NET_ADMIN]
    shm_size: 1gb
    volumes:
      - ./public-sim/client.sh:/client.sh:ro,z
      - ${FLUX_SIM_CA_DIR:?}:/certs:ro,z
    command: ["/bin/sh", "/client.sh", "10.213.1.2"]
    networks:
      lan-a: { ipv4_address: 10.213.1.10 }
  client-b:
    image: *client
    cap_add: [NET_ADMIN]
    shm_size: 1gb
    volumes:
      - ./public-sim/client.sh:/client.sh:ro,z
      - ${FLUX_SIM_CA_DIR:?}:/certs:ro,z
    command: ["/bin/sh", "/client.sh", "10.213.2.2"]
    networks:
      lan-b: { ipv4_address: 10.213.2.10 }
  driver:
    image: *client
    profiles: ["sim-driver"]
    entrypoint: ["/bin/sh", "-ec", "printf 'nameserver 203.0.113.53\\n' > /etc/resolv.conf; cp /certs/ca.crt /usr/local/share/ca-certificates/flux-sim-ca.crt; update-ca-certificates >/dev/null 2>&1; exec python3 -u /sim/driver.py"]
    environment:
      FLUX_SIM_BROWSER_A: ${FLUX_SIM_BROWSER_A:-chromium}
      FLUX_SIM_BROWSER_B: ${FLUX_SIM_BROWSER_B:-chromium}
      FLUX_SIM_PHASES: ${FLUX_SIM_PHASES:-all}
      FLUX_SIM_A_RELAY: ${FLUX_SIM_A_RELAY:-tls}
    volumes:
      - ./public-sim/driver.py:/sim/driver.py:ro,z
      - ${FLUX_SIM_CA_DIR:?}:/certs:ro,z
      - ${FLUX_SIM_CTL_DIR:?}:/ctl:z
    networks:
      internet: { ipv4_address: 203.0.113.200 }
networks:
  internet:
    internal: true
    ipam: { config: [{ subnet: 203.0.113.0/24, gateway: 203.0.113.254 }] }
  lan-a:
    internal: true
    ipam: { config: [{ subnet: 10.213.1.0/24, gateway: 10.213.1.254 }] }
  lan-b:
    internal: true
    ipam: { config: [{ subnet: 10.213.2.0/24, gateway: 10.213.2.254 }] }
  proxy-net:
    internal: true
    ipam: { config: [{ subnet: 10.213.0.0/24, gateway: 10.213.0.254 }] }
