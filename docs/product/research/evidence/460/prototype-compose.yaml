services:
  migrate:
    build:
      dockerfile: ${FLUX_RESEARCH_DOCKERFILE:?research Dockerfile path required}
      additional_contexts:
        research-patch: ${FLUX_RESEARCH_PATCH_CONTEXT:?research patch context required}
  mcp-clients:
    build:
      dockerfile: ${FLUX_RESEARCH_DOCKERFILE:?research Dockerfile path required}
      additional_contexts:
        research-patch: ${FLUX_RESEARCH_PATCH_CONTEXT:?research patch context required}
    volumes:
      - ${FLUX_RESEARCH_PROBE_FILE:?research probe path required}:/app/tests/app/e2e/flux-460-probe.ts:ro,z
      - ${FLUX_RESEARCH_EVIDENCE_DIR:?research output path required}:/evidence:z
    environment:
      FLUX_RESEARCH_PATCH_SHA256: 000557a3697ca87d54d0f5b3302935495f5b8d7ccc121c64edce186c402e7595
      FLUX_GIT_COMMIT: 975747426a778cc4471bd4c9eabb8910eb187671
    command: ["node_modules/.bin/tsx", "tests/app/e2e/flux-460-probe.ts"]
networks:
  default:
    ipam:
      config:
        - subnet: ${FLUX_RESEARCH_SUBNET_DEFAULT:-10.198.100.0/24}
  runtime-control:
    ipam:
      config:
        - subnet: ${FLUX_RESEARCH_SUBNET_CONTROL:-10.198.101.0/24}
  runtime-api:
    ipam:
      config:
        - subnet: ${FLUX_RESEARCH_SUBNET_API:-10.198.102.0/24}
