<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>v5 — wątek z AI</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.v5{--page:#fcfbfa;--panel:#f4f2ef;--bubble:#f2f0ed;--text:#151515;--text2:#6b6660;--hair:#e9e6e2;--black:#111111}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pill{background:rgba(255,255,255,0.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--hair);box-shadow:0 2px 10px rgba(20,16,12,0.06)}
.orb{position:relative;flex-shrink:0;border-radius:50%;overflow:hidden;isolation:isolate;display:inline-block}
.orb::before{content:"";position:absolute;inset:-20%;background:var(--g)}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.9'/></svg>");mix-blend-mode:overlay;opacity:0.55;box-shadow:inset 0 -6px 14px rgba(0,0,0,0.12),inset 0 4px 10px rgba(255,255,255,0.35)}
.asyst{--g:radial-gradient(circle at 25% 30%,#f7c6e6 0%,rgba(247,198,230,0) 45%),radial-gradient(circle at 75% 65%,#7f8ff3 0%,rgba(127,143,243,0) 55%),radial-gradient(circle at 40% 90%,#c39cf4 0%,rgba(195,156,244,0) 50%),#b7a2f2}
.av{flex-shrink:0;border-radius:50%;background:#ebe8e4;color:#3a3632;font-weight:600;display:flex;align-items:center;justify-content:center}
.bub{margin:0;max-width:286px;box-sizing:border-box;padding:10px 15px;border-radius:20px;background:var(--bubble);font-size:16px;line-height:1.45;letter-spacing:-0.15px;color:var(--text)}
.row{display:flex;align-items:flex-end;gap:8px}
.name{margin:0 0 4px 44px;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:#ffffff;border:1px solid var(--hair);font-size:13px;color:var(--text)}
.shimmer{background:linear-gradient(90deg,#6b6660 0%,#6b6660 35%,#d9d4ce 50%,#6b6660 65%,#6b6660 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-reduced-motion: no-preference){
  .live::before{animation:spin 9s linear infinite}
  .shimmer{animation:shim 2.4s linear infinite}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
</style>
</helmet>
<div class="v5" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #e9e6e2; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased">
  <div aria-hidden="true" style="position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 500; color: #8a847d">Arduino + AI</div>

  <section aria-label="Wątek" style="position: absolute; top: 52px; left: 0; right: 0; bottom: 0; background: var(--page); border-radius: 28px 28px 0 0; box-shadow: 0 -6px 24px rgba(20,16,12,0.08); overflow: hidden">
    <div style="display: flex; justify-content: center; padding-top: 6px"><span style="width: 36px; height: 5px; border-radius: 3px; background: #d6d1cb"></span></div>
    <header style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; padding: 2px 12px">
      <span></span>
      <h2 style="margin: 0; text-align: center; font-size: 16px; font-weight: 500; letter-spacing: -0.3px">Wątek</h2>
      <button type="button" aria-label="Zamknij wątek" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
        <span style="width: 30px; height: 30px; border-radius: 15px; background: var(--panel); color: var(--text2); display: flex; align-items: center; justify-content: center">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </span>
      </button>
    </header>

    <div style="margin: 8px 16px 0 16px; padding: 16px; border-radius: 22px; background: #ffffff; border: 1px solid var(--hair); display: flex; flex-direction: column; gap: 8px">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2)"><span class="av" style="width: 22px; height: 22px; font-size: 10px">M</span>Marek · 07:00</span>
      <span style="font-size: 19px; line-height: 1.4; font-weight: 500; letter-spacing: -0.4px">Do testu wystarczy USB-C. Odkładamy baterię?</span>
    </div>

    <main style="display: flex; flex-direction: column; gap: 4px; padding: 22px 14px 0 14px">
      <p class="name">Asystent <span style="padding: 1px 6px; border-radius: 6px; background: var(--panel); font-size: 10px; font-weight: 600; letter-spacing: 0.3px">AI</span></p>
      <div class="row">
        <span class="orb asyst" style="width: 34px; height: 34px"></span>
        <div class="bub" style="display: flex; flex-direction: column; gap: 10px">
          <span>Taśma przy pełnej jasności bierze ok. 1,2 A, a USB-C daje 0,9 A. Na test ustaw jasność 60%.</span>
          <span style="display: flex; flex-wrap: wrap; gap: 6px">
            <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>pomiary-wieczor.csv</span>
            <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 10h6M9 14h6"></path></svg>Wiki: Zasilanie</span>
          </span>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-top: 14px">
        <p class="bub" style="background: var(--black); color: #ffffff">Odkładamy baterię. Testujemy przy 60%.</p>
      </div>

      <div class="row" style="margin-top: 14px" role="status" aria-label="Asystent zapisuje decyzję">
        <span class="orb asyst live" style="width: 34px; height: 34px"></span>
        <span class="shimmer" style="padding: 0 0 8px 2px; font-size: 14px">Zapisuję decyzję w zadaniu…</span>
      </div>
    </main>

    <div aria-hidden="true" style="position: absolute; bottom: 0; left: 0; right: 0; height: 110px; background: linear-gradient(to top, rgba(252,251,250,1) 0%, rgba(252,251,250,0.92) 50%, rgba(252,251,250,0) 100%)"></div>
    <form class="pill" style="position: absolute; left: 10px; right: 10px; bottom: 28px; display: flex; align-items: center; gap: 2px; height: 54px; box-sizing: border-box; padding: 0 5px 0 18px; border-radius: 27px">
      <label for="v5reply" class="sr">Odpowiedz w wątku</label>
      <input id="v5reply" type="text" placeholder="Odpowiedz…" style="flex-grow: 1; min-width: 0; height: 44px; border: none; outline: none; background: transparent; font-size: 16px; color: var(--text); font-family: inherit">
      <button type="submit" aria-label="Wyślij odpowiedź" style="width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
        <span style="width: 38px; height: 38px; border-radius: 19px; background: var(--black); color: #ffffff; display: flex; align-items: center; justify-content: center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
        </span>
      </button>
    </form>
  </section>
</div>
</x-dc>
