# Dependabot version updates (#834). Security updates and alerts are repository settings, not this file.
# Weekly, grouped, a few open PRs at most: a PR here is a lockfile or pin change reviewed like any other and
# merged through the normal checks. The first run on the default branch is the proof that each ecosystem works
# (Insights > Dependency graph > Dependabot); docs/agents/ci-and-releases.md#security-scanning records it.
version: 2
updates:
  # The pnpm workspace. One lockfile at app/pnpm-lock.yaml governs every package under app/.
  - package-ecosystem: npm
    directories: ["/app", "/app/apps/*", "/app/packages/*"]
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "Deps"
    groups:
      # These carry a local patch (app/patches, patchedDependencies in pnpm-workspace.yaml) for one exact version. A bump
      # fails to install until the patch is ported, so they travel together in one PR that a person finishes.
      patched:
        patterns: ["better-auth", "@better-auth/*", "drizzle-orm"]
      production:
        dependency-type: production
        update-types: [minor, patch]
        group-by: dependency-name
      development:
        dependency-type: development
        update-types: [minor, patch]
        group-by: dependency-name
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "Deps"
    groups:
      actions:
        patterns: ["*"]
  # Dockerfiles and Compose files. Dependabot follows `image:tag@sha256:...` pins; an image pinned by digest alone
  # (most of docker/) has no tag to follow and is updated by hand (docs/agents/ci-and-releases.md#security-scanning).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "Deps"
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "Deps"
    groups:
      images:
        patterns: ["*"]
