# Dependabot version updates (#834). Security updates and alerts are repository settings, not this file.
# Weekly, grouped, a few open PRs at most: a PR here is a lockfile or pin change reviewed like any other and
# merged through the normal checks. The first run on the default branch is the proof that each ecosystem works
# (Insights > Dependency graph > Dependabot); docs/agents/ci-and-releases.md#security-scanning records it.
#
# Grouping. A group is a batch: Dependabot opens one pull request per group and directory with every dependency that
# matches it (a dependency goes into the first group it matches). `group-by: dependency-name` is not used: it makes one
# pull request per dependency across directories, which is the opposite of a batch. What no group matches (a major
# update, where a group lists `update-types`) arrives alone, so it gets its own review.
#
# Coverage: every directory of the repository that holds a manifest, a lockfile, a Dockerfile or a Compose file
# (tests/test_security_scan.py checks it), except two: app/tests/ui/requirements.txt and demo-requirements.txt (pip), whose
# Playwright pin must equal the tag of the image in docker/ui-tests.Dockerfile, which a version-only PR would break; and
# the prototype Dockerfile under docs/product/research/evidence/460, which is research evidence and is never built.
# Playwright is moved by hand on both sides of each pair, so it is ignored where Dependabot would move one side only: the
# `playwright` npm package (app/package.json, which docker/Dockerfile's e2e image must match) and the
# mcr.microsoft.com/playwright and playwright/python images (docker/Dockerfile, docker/ui-tests.Dockerfile, docker/public-sim/client.Dockerfile).
version: 2
updates:
  # The pnpm workspace. One lockfile at app/pnpm-lock.yaml governs every package under app/ (apps, packages, examples).
  - package-ecosystem: npm
    directories: ["/app", "/app/apps/*", "/app/packages/*", "/app/examples/*"]
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "Deps"
    ignore:
      - dependency-name: "playwright"
      # The types follow the runtime: every Node stage is node:24-alpine (docker/Dockerfile), so @types/node stays on 24.x. In #1084 it
      # offered 26, whose typings describe APIs Node 24 does not have. Move this and the pin together when the runtime moves.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      # These carry a local patch (app/patches, patchedDependencies in pnpm-workspace.yaml) for one exact version. A bump
      # fails to install until the patch is ported, so they travel together in one PR that a person finishes.
      patched:
        patterns: ["better-auth", "@better-auth/*", "drizzle-orm"]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  # The documentation site (Astro Starlight, package-lock.json) and the test tooling with a lockfile of their own
  # (app/tooling: the live-editing calibration on pnpm, the SFU test on npm). Not part of the workspace above.
  - package-ecosystem: npm
    directories: ["/site", "/app/tooling/live-editing-calibration", "/app/tooling/live-sfu-test"]
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "Deps"
    groups:
      site-and-tooling:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "Deps"
    groups:
      actions:
        patterns: ["*"]
  # Dockerfiles and Compose files (docker/, the public-network simulation, the promo renderer). Dependabot follows
  # `image:tag@sha256:...` pins; an image pinned by digest alone (most of docker/) has no tag to follow and is updated
  # by hand (docs/agents/ci-and-releases.md#security-scanning).
  - package-ecosystem: docker
    directories: ["/docker", "/docker/database", "/docker/public-sim", "/scripts/promo", "/scripts/eval/retrieval"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "Deps"
    ignore:
      # Dependabot names these images without the registry: its pull request #1194 (2026-11-10) read "Updates `playwright`" and
      # "Updates `playwright/python`", so the earlier `mcr.microsoft.com/playwright*` entry matched neither. Both names are listed.
      - dependency-name: "playwright"
      - dependency-name: "playwright/python"
      # Every Node stage is pinned by digest alone (`FROM node@sha256:...`, with its tag in a comment): Dependabot has no tag to
      # follow and in #1086 offered the Debian `node:26` image. The pin is moved by hand to the current `node:24-alpine`
      # digest (docs/agents/ci-and-releases.md#security-scanning, #1179).
      - dependency-name: "node"
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directories: ["/docker", "/docker/public-sim", "/scripts/eval/retrieval"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "Deps"
    groups:
      images:
        patterns: ["*"]
