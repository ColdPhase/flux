name: Milestone task
description: Agree on a bounded research, design, application, CI, or release outcome.
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this for planned work by people or agents. Search existing tasks first.
        A maintainer or authorized worker admits the task to the selected milestone.
        Filling out this form does not start automation.
  - type: textarea
    id: release
    attributes:
      label: Milestone and decisions
      description: Link the milestone, its reviewed brief, relevant foundation sections, and accepted decisions. No parent issue is required.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and scope
      description: What observable user outcome or engineering deliverable will this task provide? What is excluded?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Give criteria stable IDs such as AC-1. Include relevant failure and permission cases.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Explain how each criterion will be checked and what evidence will be attached. For CI tasks, include failure behavior; for releases, test the built package.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Ownership and dependencies
      description: Name one implementation owner, a different evaluator, blocking issues, and shared interfaces. Write "None" for no dependencies.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract status
      description: Link the proposal and peer acceptance comments when available. Leave as proposed until the exact contract revision is accepted.
  - type: textarea
    id: blockers
    attributes:
      label: Blockers and recovery
      description: Record attempted solutions, specific help requested from the peer, remaining work, and what would unblock it. Park only this task and continue independent milestone work.
