name: Bug report
description: Report a reproducible problem in Flux.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before reporting. Use sample data in screenshots and logs.
        For vulnerabilities, use [private reporting](https://github.com/ColdPhase/flux/security/advisories/new).
        For questions, use [Discussions](https://github.com/ColdPhase/flux/discussions).
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Include the commit from `git rev-parse --short HEAD`, or the installed release version.
      placeholder: "Commit abc1234 or release version"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: "Firefox 148 on Fedora 42, or Safari on iOS"
    validations:
      required: true
  - type: dropdown
    id: launch-method
    attributes:
      label: How did you open Flux?
      options:
        - ./flux up
        - ./flux dev
        - Installed app (PWA) on a phone or tablet
        - Operator install from docker/compose.yaml
        - Another method (describe below)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include whether you started with fresh sample data or imported existing data.
      placeholder: |
        1. Run ./flux up and ./flux demo, then sign in as Ada.
        2. Go to ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened and attach screenshots if useful.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or additional context
      description: Optional. Include ./flux logs api and relevant browser console output. Remove tokens, personal data, and private project content.
