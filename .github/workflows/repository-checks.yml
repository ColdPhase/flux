name: Repository checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-setup:
    name: Agent setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release tags: tests/test_released_migrations.py compares every released migration with the file of its tag (#1241).
          fetch-tags: true
      - name: Validate shared instructions, skills, and document links
        run: python3 scripts/check_agent_setup.py
      - name: Test the foundation checks
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Configuration reference matches the code
        run: python3 scripts/config_reference.py --check
