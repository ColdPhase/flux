name: CodeQL

# #836: CodeQL's security-extended queries over the TypeScript source (javascript-typescript, no build needed). On pull
# requests that change that source, and once a week on main. Same-repository pull requests only: a fork's token cannot
# upload results. Findings appear under Security > Code scanning; docs/agents/ci-and-releases.md#security-scanning
# says who triages them. Not a required check.
on:
  pull_request:
    branches: [main]
    paths:
      - "app/apps/**"
      - "app/packages/**"
      - "app/tooling/**"
      - app/pnpm-lock.yaml
      - .github/codeql/**
      - .github/workflows/codeql.yml
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
