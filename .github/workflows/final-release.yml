name: Final release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, for example v1.0.0 or v1.0.0-rc.1
        required: true
        type: string
      candidate_sha:
        description: Exact independently accepted protected-main SHA
        required: true
        type: string
      acceptance_issue:
        description: Issue with the owner's acceptance and an independent reviewer's exact-SHA review
        required: true
        type: string
      platforms:
        # v0.1 ships linux/amd64 only; v0.1.1 re-enables arm64 with linux/amd64,linux/arm64.
        description: Image platforms, linux/amd64 or linux/amd64,linux/arm64
        required: false
        default: linux/amd64
        type: string

permissions:
  contents: read

concurrency:
  group: final-release
  cancel-in-progress: false

jobs:
  candidate:
    name: Validate accepted candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      source_sha: ${{ steps.check.outputs.source_sha }}
      version: ${{ steps.check.outputs.version }}
      platforms: ${{ steps.check.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main SHA, version and independent acceptance
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          ACCEPTANCE_ISSUE: ${{ inputs.acceptance_issue }}
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_PLATFORMS" =~ ^linux/amd64(,linux/arm64)?$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          [[ "$ACCEPTANCE_ISSUE" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          test -f docker/compose.yaml
          test -f docker/compose.runtime.yaml
          test -f docker/runtime.sh
          test -f docker/.env.example
          test -f docker/compose.live.yaml
          test -f docker/compose.live.turn.yaml
          # ls-remote --exit-code reports 2 only for an absent ref; another failure is not "free".
          tag_status=0
          git ls-remote --exit-code --tags --refs origin "refs/tags/$RELEASE_VERSION" >/dev/null ||
            tag_status=$?
          if [ "$tag_status" -eq 0 ]; then
            echo 'Version tag already exists; inspect the existing release before retrying.' >&2
            exit 1
          fi
          if [ "$tag_status" -ne 2 ]; then
            echo 'Could not read the remote tags; not assuming the version is unused.' >&2
            exit 1
          fi
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$ACCEPTANCE_ISSUE/comments?per_page=100" \
            > "$RUNNER_TEMP/acceptance-comments.json"
          # The reviewer's session must not be in the candidate's history (reviewer != author).
          git log --format=%B "$CANDIDATE_SHA" > "$RUNNER_TEMP/commit-messages.txt"
          python3 scripts/release/verify_acceptance.py \
            --comments "$RUNNER_TEMP/acceptance-comments.json" --source-sha "$CANDIDATE_SHA" \
            --commit-messages "$RUNNER_TEMP/commit-messages.txt"
          {
            echo "source_sha=$CANDIDATE_SHA"
            echo "version=$RELEASE_VERSION"
            echo "platforms=$RELEASE_PLATFORMS"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Build OCI images for ${{ needs.candidate.outputs.platforms }}
    needs: candidate
    runs-on: ubuntu-latest
    # Two images from one builder: the agent-runtime build reuses the application build's cached stages.
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      runtime_digest: ${{ steps.build_runtime.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        # Only when arm64 is requested (v0.1 builds linux/amd64 natively and needs no emulator).
        if: contains(needs.candidate.outputs.platforms, 'linux/arm64')
        with:
          # The action's default is the moving tonistiigi/binfmt:latest; pin the emulator that
          # builds the arm64 image (qemu-v10.2.3, the digest of the index) and install only arm64.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the untagged candidate manifest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The same inputs as the source Compose and the PR check: docker/Dockerfile with app/ as
          # the context; its final (runtime) stage is the image that api, worker and migrate run.
          context: ./app
          file: ./docker/Dockerfile
          target: runtime
          platforms: ${{ needs.candidate.outputs.platforms }}
          outputs: type=image,name=ghcr.io/coldphase/flux,push=true,push-by-digest=true,name-canonical=true
          provenance: mode=max
          # BuildKit's default scanner is the moving docker/buildkit-syft-scanner:stable-1; pin 1.12.0.
          sbom: generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.candidate.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.candidate.outputs.version }}
      - name: Attest the pushed manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/coldphase/flux
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Confirm the platform manifests
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_PLATFORMS: ${{ needs.candidate.outputs.platforms }}
        run: |
          docker buildx imagetools inspect --raw "ghcr.io/coldphase/flux@$IMAGE_DIGEST" \
            > "$RUNNER_TEMP/index.json"
          python3 - "$RUNNER_TEMP/index.json" "$RELEASE_PLATFORMS" <<'PY'
          import json, sys
          index = json.load(open(sys.argv[1], encoding='utf-8'))
          platforms = {
              (item.get('platform', {}).get('os'), item.get('platform', {}).get('architecture'))
              for item in index.get('manifests', [])
          }
          wanted = {tuple(p.split('/')) for p in sys.argv[2].split(',')}
          assert wanted <= platforms, (wanted, platforms)
          PY
      - name: Generate image SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/coldphase/flux@${{ steps.build.outputs.digest }}
          output-file: sbom.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Build and push the untagged agent-runtime manifest
        id: build_runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The separate slot/installer image (#358): the supervisor with process hardening and the pinned
          # official Codex, from the same Dockerfile and context. Claude Code is never in it.
          context: ./app
          file: ./docker/Dockerfile
          target: agent-runtime-release
          platforms: ${{ needs.candidate.outputs.platforms }}
          outputs: type=image,name=ghcr.io/coldphase/flux-agent-runtime,push=true,push-by-digest=true,name-canonical=true
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.candidate.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.candidate.outputs.version }}
      - name: Attest the pushed agent-runtime manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/coldphase/flux-agent-runtime
          subject-digest: ${{ steps.build_runtime.outputs.digest }}
          push-to-registry: true
      - name: Confirm the agent-runtime platform manifests
        env:
          RUNTIME_DIGEST: ${{ steps.build_runtime.outputs.digest }}
          RELEASE_PLATFORMS: ${{ needs.candidate.outputs.platforms }}
        run: |
          docker buildx imagetools inspect --raw "ghcr.io/coldphase/flux-agent-runtime@$RUNTIME_DIGEST" \
            > "$RUNNER_TEMP/runtime-index.json"
          python3 - "$RUNNER_TEMP/runtime-index.json" "$RELEASE_PLATFORMS" <<'PY'
          import json, sys
          index = json.load(open(sys.argv[1], encoding='utf-8'))
          platforms = {
              (item.get('platform', {}).get('os'), item.get('platform', {}).get('architecture'))
              for item in index.get('manifests', [])
          }
          wanted = {tuple(p.split('/')) for p in sys.argv[2].split(',')}
          assert wanted <= platforms, (wanted, platforms)
          PY
      - name: Check the pinned Codex and the absence of Claude Code on every platform
        env:
          RUNTIME_DIGEST: ${{ steps.build_runtime.outputs.digest }}
          RELEASE_PLATFORMS: ${{ needs.candidate.outputs.platforms }}
        run: |
          set -euo pipefail
          pinned=$(grep -o 'rust-v[0-9]*\.[0-9]*\.[0-9]*' docker/Dockerfile | sort -u)
          test "$(printf '%s\n' "$pinned" | wc -l)" = 1
          for platform in ${RELEASE_PLATFORMS//,/ }; do
            image="ghcr.io/coldphase/flux-agent-runtime@$RUNTIME_DIGEST"
            version=$(docker run --rm --network none --platform "$platform" \
              --entrypoint /opt/flux-runtime/codex/bin/codex "$image" --version)
            test "$version" = "codex-cli ${pinned#rust-v}"
            docker run --rm --network none --platform "$platform" --entrypoint sh "$image" -c '
              ! command -v claude >/dev/null 2>&1 &&
              [ -z "$(find / -xdev \( -name claude -o -name claude-code \) -not -path "/proc/*" 2>/dev/null | head -n 1)" ] &&
              [ -z "$(ls -A /opt/flux-tools)" ]'
            echo "$platform: $version, no Claude Code"
          done
      - name: Generate agent-runtime image SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/coldphase/flux-agent-runtime@${{ steps.build_runtime.outputs.digest }}
          output-file: sbom-agent-runtime.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: |
            sbom.spdx.json
            sbom-agent-runtime.spdx.json
          if-no-files-found: error

  scan:
    name: Scan the images for known vulnerabilities
    needs: [candidate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false
      - name: Scan both images on every platform (HIGH/CRITICAL findings with a fix fail unless allowlisted)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.image.outputs.runtime_digest }}
          RELEASE_PLATFORMS: ${{ needs.candidate.outputs.platforms }}
        run: |
          python3 scripts/security_scan.py image --platforms "$RELEASE_PLATFORMS" --report-dir security-reports \
            --cache "$RUNNER_TEMP/trivy" --summary-file security-reports/summary.md \
            "ghcr.io/coldphase/flux@$IMAGE_DIGEST" "ghcr.io/coldphase/flux-agent-runtime@$RUNTIME_DIGEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-scan
          path: security-reports/*
          if-no-files-found: ignore

  package:
    name: Test packaged installation
    needs: [candidate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: release-input
      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.source_sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.image.outputs.runtime_digest }}
          RELEASE_PLATFORMS: ${{ needs.candidate.outputs.platforms }}
        run: |
          python3 scripts/release/prepare_assets.py \
            --version "$RELEASE_VERSION" --source-sha "$CANDIDATE_SHA" \
            --digest "$IMAGE_DIGEST" --sbom release-input/sbom.spdx.json \
            --runtime-digest "$RUNTIME_DIGEST" --runtime-sbom release-input/sbom-agent-runtime.spdx.json \
            --platforms "$RELEASE_PLATFORMS" --destination release-assets
          cd release-assets
          sha256sum -c SHA256SUMS
          python3 ../scripts/release/verify_assets.py . \
            --version "$RELEASE_VERSION" --source-sha "$CANDIDATE_SHA" --digest "$IMAGE_DIGEST" \
            --platforms "$RELEASE_PLATFORMS"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install, back up and restore the packaged image
        run: bash scripts/release/smoke_artifacts.sh release-assets "$RUNNER_TEMP/flux-smoke" "fluxrelease${{ github.run_id }}" "fluxrestore${{ github.run_id }}"
      - name: Check the runtime overlay against the source stack
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD=x FLUX_FIXTURE_TOKEN=x FLUX_PUBLIC_ORIGIN=http://127.0.0.1 FLUX_AUTH_SECRET=x
          docker compose -f docker/compose.source.yaml -f docker/compose.source.runtime.yaml --profile runtime config --format json > "$RUNNER_TEMP/source-config.json"
          export FLUX_PROJECT=fluxcompare
          docker compose -f release-assets/compose.yaml -f release-assets/compose.runtime.yaml --profile runtime config --format json \
            > "$RUNNER_TEMP/release-config.json"
          python3 scripts/release/compare_runtime_overlay.py "$RUNNER_TEMP/source-config.json" "$RUNNER_TEMP/release-config.json"
      - name: Check the live-media overlays on the release compose.yaml
        run: bash scripts/release/check_live_overlay.sh release-assets
      - name: Install the packaged agent runtime (switch-on, isolation, off, purge)
        run: bash scripts/release/smoke_runtime.sh release-assets "$RUNNER_TEMP/flux-runtime-smoke" "fluxruntime${{ github.run_id }}"
      # No asset name starts with a period (prepare_assets.py enforces it): upload-artifact skips
      # hidden files and GitHub renames them as Release assets.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  sign:
    name: Sign both images (keyless, GitHub OIDC)
    # After the scan and the packaged install pass: a signature says "built by this workflow from the accepted candidate, and it passed
    # its gates", not only "built". The certificate names this file on main, which publish-release.yml and operators check (#840).
    needs: [candidate, image, package, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Sign the two digests and check the signatures verify the way operators check them
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.image.outputs.runtime_digest }}
        run: |
          set -euo pipefail
          # By digest, never by tag: the signature belongs to the manifest the draft and the reviewers name.
          cosign sign --yes "ghcr.io/coldphase/flux@$IMAGE_DIGEST" "ghcr.io/coldphase/flux-agent-runtime@$RUNTIME_DIGEST"
          bash scripts/release/verify_signatures.sh \
            "ghcr.io/coldphase/flux@$IMAGE_DIGEST" "ghcr.io/coldphase/flux-agent-runtime@$RUNTIME_DIGEST"

  draft:
    name: Create draft for independent artifact review
    needs: [candidate, image, package, scan, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Create immutable-source draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.source_sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.image.outputs.runtime_digest }}
          ACCEPTANCE_ISSUE: ${{ inputs.acceptance_issue }}
          RELEASE_PLATFORMS: ${{ needs.candidate.outputs.platforms }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/release/check_asset_set.py" .
          python3 "$GITHUB_WORKSPACE/scripts/release/verify_assets.py" . \
            --version "$RELEASE_VERSION" --source-sha "$CANDIDATE_SHA" --digest "$IMAGE_DIGEST" \
            --platforms "$RELEASE_PLATFORMS"
          jq -e --arg r "ghcr.io/coldphase/flux-agent-runtime@$RUNTIME_DIGEST" '.runtime_image == $r' release.json
          # Drafts have no tag yet, so a retry could add a second draft for the same version.
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.RELEASE_VERSION) | .id')
          if [ -n "$existing" ]; then
            echo "A release or draft for $RELEASE_VERSION already exists; delete the unpublished draft or use a new version." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Flux $RELEASE_VERSION candidate

          Source: $CANDIDATE_SHA
          OCI candidate image: ghcr.io/coldphase/flux@$IMAGE_DIGEST
          Agent-runtime candidate image: ghcr.io/coldphase/flux-agent-runtime@$RUNTIME_DIGEST
          Platforms (both images): ${RELEASE_PLATFORMS//,/, }
          Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Image scan: job "Scan the images for known vulnerabilities" of that run (Trivy; no HIGH/CRITICAL finding with a fix, except the reviewed exceptions of .github/security-allowlist.json)
          Signatures: both digests are signed keylessly by this workflow (cosign, Sigstore, GitHub OIDC) after the scan and the packaged install pass; INSTALL.md shows how to verify them with cosign verify and the provenance with gh attestation verify before you pull
          Integrated acceptance: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$ACCEPTANCE_ISSUE

          Install with the attached version-matched compose.yaml, env.example and INSTALL.md; check every file with SHA256SUMS first.
          The optional agent runtime is the attached compose.runtime.yaml with runtime.sh (off by default; Claude Code is not included in any image).
          Calls and screen sharing: the attached compose.live.yaml, which pins the LiveKit SFU by digest (compose.live.turn.yaml adds TURN/TLS to it); see INSTALL.md.
          This draft requires independent packaged install, upgrade and restore review before the version tag and release are published.
          EOF
          release_flags=(--draft)
          if [[ "$RELEASE_VERSION" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" ./* \
            --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" \
            --title "Flux $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${release_flags[@]}"
