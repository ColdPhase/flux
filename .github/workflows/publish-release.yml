name: Publish reviewed release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Existing draft version, for example v1.0.0
        type: string
      source_sha:
        required: true
        description: Exact accepted source SHA
        type: string
      image_digest:
        required: true
        description: Exact reviewed OCI index digest, sha256:...
        type: string
      review_issue:
        required: true
        description: Issue with the independent exact-artifact review
        type: string

permissions:
  contents: read

concurrency:
  group: final-release
  cancel-in-progress: false

jobs:
  verify:
    name: Check draft, assets and independent review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub shows a draft Release only to identities with push access: a read-only token gets
      # "release not found" for the draft this job must inspect. Every step here only reads.
      contents: write
      issues: read
      packages: read
    outputs:
      checksums_sha: ${{ steps.check.outputs.checksums_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      - name: Verify exact draft and peer artifact record
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FLUX_RELEASE_ADMIN_READ_TOKEN: ${{ secrets.FLUX_RELEASE_ADMIN_READ_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          REVIEW_ISSUE: ${{ inputs.review_issue }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REVIEW_ISSUE" =~ ^[1-9][0-9]*$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          test -n "$FLUX_RELEASE_ADMIN_READ_TOKEN" || {
            echo 'Configure FLUX_RELEASE_ADMIN_READ_TOKEN with repository Administration (read) permission.' >&2
            exit 1
          }
          GH_TOKEN="$FLUX_RELEASE_ADMIN_READ_TOKEN" \
            gh api "repos/$GITHUB_REPOSITORY/immutable-releases" | \
            python3 scripts/release/check_immutable_releases.py
          bash scripts/release/check_release_target.sh "$RELEASE_VERSION" "$SOURCE_SHA" draft
          mkdir -p "$RUNNER_TEMP/reviewed-assets"
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/reviewed-assets"
          cd "$RUNNER_TEMP/reviewed-assets"
          sha256sum -c SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/release/check_asset_set.py" .
          jq -e --arg v "$RELEASE_VERSION" --arg s "$SOURCE_SHA" \
            --arg i "ghcr.io/coldphase/flux@$IMAGE_DIGEST" \
            '.version == $v and .source_sha == $s and .image == $i' release.json
          test "$(grep -Fc "image: ghcr.io/coldphase/flux@$IMAGE_DIGEST" compose.yaml)" = 4
          # The agent-runtime digest is not a dispatch input: release.json is covered by the SHA256SUMS
          # that the independent reviewer's ACCEPTED RELEASE ARTIFACT line binds. verify_assets.py checks
          # both images' digests in every file, the platforms and that Claude Code is not included.
          # The platforms are release.json's (reviewed under SHA256SUMS): linux/amd64 for v0.1.
          python3 "$GITHUB_WORKSPACE/scripts/release/verify_assets.py" . \
            --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA" --digest "$IMAGE_DIGEST"
          runtime_digest=$(jq -r '.runtime_image | split("@")[1]' release.json)
          [[ "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          database_digest=$(jq -r '.database_image | split("@")[1]' release.json)
          [[ "$database_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          platforms=$(jq -r '.platforms | join(" ")' release.json)
          [[ " $platforms " == *" linux/amd64 "* ]]
          for platform in $platforms; do
            docker buildx imagetools inspect --raw "ghcr.io/coldphase/flux-agent-runtime@$runtime_digest" |
              jq -e --arg p "${platform#*/}" '[.manifests[].platform | select(.os == "linux" and .architecture == $p)] | length >= 1'
            docker buildx imagetools inspect --raw "ghcr.io/coldphase/flux@$IMAGE_DIGEST" |
              jq -e --arg p "${platform#*/}" '[.manifests[].platform | select(.os == "linux" and .architecture == $p)] | length >= 1'
            docker buildx imagetools inspect --raw "ghcr.io/coldphase/flux-database@$database_digest" |
              jq -e --arg p "${platform#*/}" '[.manifests[].platform | select(.os == "linux" and .architecture == $p)] | length >= 1'
          done
          # Every reviewed digest carries the release workflow's keyless signature (#840): nothing unsigned becomes a release.
          bash "$GITHUB_WORKSPACE/scripts/release/verify_signatures.sh" \
            "ghcr.io/coldphase/flux@$IMAGE_DIGEST" "ghcr.io/coldphase/flux-agent-runtime@$runtime_digest" \
            "ghcr.io/coldphase/flux-database@$database_digest"
          checksums_sha=$(sha256sum SHA256SUMS | cut -d ' ' -f1)
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$REVIEW_ISSUE/comments?per_page=100" \
            > "$RUNNER_TEMP/artifact-comments.json"
          # The reviewer's session must not be in the source's history (reviewer != author).
          git -C "$GITHUB_WORKSPACE" log --format=%B "$SOURCE_SHA" > "$RUNNER_TEMP/commit-messages.txt"
          python3 "$GITHUB_WORKSPACE/scripts/release/verify_artifact_review.py" \
            --comments "$RUNNER_TEMP/artifact-comments.json" \
            --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA" \
            --digest "$IMAGE_DIGEST" --checksums-sha "$checksums_sha" \
            --commit-messages "$RUNNER_TEMP/commit-messages.txt"
          echo "checksums_sha=$checksums_sha" >> "$GITHUB_OUTPUT"

  publish:
    name: Pin version tag and publish immutable release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote reviewed digest and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          FLUX_RELEASE_ADMIN_READ_TOKEN: ${{ secrets.FLUX_RELEASE_ADMIN_READ_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          CHECKSUMS_SHA: ${{ needs.verify.outputs.checksums_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publish-assets"
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/publish-assets"
          cd "$RUNNER_TEMP/publish-assets"
          sha256sum -c SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/release/check_asset_set.py" .
          test "$(sha256sum SHA256SUMS | cut -d ' ' -f1)" = "$CHECKSUMS_SHA"
          jq -e --arg v "$RELEASE_VERSION" --arg s "$SOURCE_SHA" \
            --arg i "ghcr.io/coldphase/flux@$IMAGE_DIGEST" \
            '.version == $v and .source_sha == $s and .image == $i' release.json
          python3 "$GITHUB_WORKSPACE/scripts/release/verify_assets.py" . \
            --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA" --digest "$IMAGE_DIGEST"
          runtime_digest=$(jq -r '.runtime_image | split("@")[1]' release.json)
          [[ "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          database_digest=$(jq -r '.database_image | split("@")[1]' release.json)
          [[ "$database_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash "$GITHUB_WORKSPACE/scripts/release/check_release_target.sh" \
            "$RELEASE_VERSION" "$SOURCE_SHA" draft
          bash "$GITHUB_WORKSPACE/scripts/release/promote_image_tag.sh" \
            "$RELEASE_VERSION" "$IMAGE_DIGEST"
          bash "$GITHUB_WORKSPACE/scripts/release/promote_image_tag.sh" \
            "$RELEASE_VERSION" "$runtime_digest" ghcr.io/coldphase/flux-agent-runtime
          bash "$GITHUB_WORKSPACE/scripts/release/promote_image_tag.sh" \
            "$RELEASE_VERSION" "$database_digest" ghcr.io/coldphase/flux-database
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          for tag in "ghcr.io/coldphase/flux:$RELEASE_VERSION" "ghcr.io/coldphase/flux-agent-runtime:$RELEASE_VERSION" \
              "ghcr.io/coldphase/flux-database:$RELEASE_VERSION"; do
            DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" \
              docker buildx imagetools inspect "$tag" >/dev/null
          done
          bash "$GITHUB_WORKSPACE/scripts/release/check_release_target.sh" \
            "$RELEASE_VERSION" "$SOURCE_SHA" draft
          test -n "$FLUX_RELEASE_ADMIN_READ_TOKEN" || {
            echo 'Configure FLUX_RELEASE_ADMIN_READ_TOKEN with repository Administration (read) permission.' >&2
            exit 1
          }
          GH_TOKEN="$FLUX_RELEASE_ADMIN_READ_TOKEN" \
            gh api "repos/$GITHUB_REPOSITORY/immutable-releases" | \
            python3 "$GITHUB_WORKSPACE/scripts/release/check_immutable_releases.py"
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          bash "$GITHUB_WORKSPACE/scripts/release/check_release_target.sh" \
            "$RELEASE_VERSION" "$SOURCE_SHA" published
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" \
            > "$RUNNER_TEMP/published-release.json"
          jq -e '.draft == false and .immutable == true' "$RUNNER_TEMP/published-release.json"
          mkdir -p "$RUNNER_TEMP/public-assets"
          jq -r '.assets[].browser_download_url' "$RUNNER_TEMP/published-release.json" | \
            while IFS= read -r url; do
              curl --fail --location --silent --show-error "$url" \
                -o "$RUNNER_TEMP/public-assets/${url##*/}"
            done
          cd "$RUNNER_TEMP/public-assets"
          sha256sum -c SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/release/verify_assets.py" . \
            --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA" --digest "$IMAGE_DIGEST"
          # The public version tags resolve to the digests the public assets pin.
          for entry in "flux:$IMAGE_DIGEST" "flux-agent-runtime:$runtime_digest" "flux-database:$database_digest"; do
            name=${entry%%:*}
            wanted=${entry#*:}
            actual=$(DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" \
              docker buildx imagetools inspect "ghcr.io/coldphase/$name:$RELEASE_VERSION" --format '{{json .Manifest}}' | jq -r .digest)
            test "$actual" = "$wanted"
          done
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_VERSION"
