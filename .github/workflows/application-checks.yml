name: Application checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Application validation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Build, type check, lint and run portable tests in Docker
        run: |
          set -eu
          run_id="${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-$$"
          image="flux-pr-check:$run_id"
          container="flux-pr-check-$run_id"
          cleanup() {
            docker container rm -f "$container" >/dev/null 2>&1 || true
            docker image rm "$image" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          docker build --file infra/Dockerfile --target test --tag "$image" .
          docker run --rm --name "$container" --network none "$image" \
            pnpm exec tsx --test tests/app/architecture.test.ts tests/app/*-core.test.ts
