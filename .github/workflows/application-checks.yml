name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: application-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Application validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Build and run fast application checks in Docker
        run: ./scripts/check_application.sh
      # One-command start smoke (#72): reuses the build cache from the step above.
      - name: Smoke-test ./flux up and ./flux demo headless
        run: |
          ./flux up
          curl -fsS http://127.0.0.1:8081/api/v1/health
          ./flux demo
      - name: Remove the smoke-test stack
        if: always()
        run: '[ ! -f .env ] || ./flux clean -y'
