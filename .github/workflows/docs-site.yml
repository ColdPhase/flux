name: Docs site

# Builds the documentation site (site/) from docs/ and README.md and checks its internal links, on
# pull requests that change it. Deploys to GitHub Pages only from main. The same build runs locally
# with ./scripts/check_docs_site.sh.
on:
  pull_request:
    branches: [main]
    paths:
      - site/**
      - README.md
      - CHANGELOG.md
      - GOVERNANCE.md
      - docs/operations/**
      - docs/integrations/**
      - docs/SECURITY.md
      - docs/CONTRIBUTING.md
      - docs/product/encrypted-workspaces.md
      - docs/product/licensing.md
      - docs/assets/**
      - app/apps/web/src/ui/fonts/**
      - scripts/check_docs_site.sh
      - .github/workflows/docs-site.yml
  push:
    branches: [main]
    paths:
      - site/**
      - README.md
      - CHANGELOG.md
      - GOVERNANCE.md
      - docs/operations/**
      - docs/integrations/**
      - docs/SECURITY.md
      - docs/CONTRIBUTING.md
      - docs/product/encrypted-workspaces.md
      - docs/product/licensing.md
      - docs/assets/**
      - app/apps/web/src/ui/fonts/**
      - scripts/check_docs_site.sh
      - .github/workflows/docs-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Docs site build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the site and check its links in Docker
        run: ./scripts/check_docs_site.sh
      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
