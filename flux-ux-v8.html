function helpDialog(){openDialog(`<div class="row"><span class="eyebrow">Mapa bez instrukcji obsługi</span><span class="grow"></span>${ib('x','close-dialog','Zamknij','flat')}</div><h2>Chwyć. Przesuń. Dopisz.</h2><p>Myśli, rozmowy i zadania są powiązane — ale nie stają się kopiami siebie nawzajem.</p><div class="help-grid"><span>Przesuń myśl lub zaznaczenie</span><b>Przeciągnij</b><span>Edytuj tekst w miejscu</span><b>Dwuklik / Enter</b><span>Dopisz połączoną myśl</span><b>Plus przy myśli</b><span>Połącz istniejące myśli</span><b>Menu → Połącz</b><span>Przesuń całe płótno</span><b>Przeciągnij tło</b><span>Zaznacz kilka</span><b>Przycisk zaznaczenia</b><span>Przybliż / oddal</span><b>Kółko / + i −</b><span>Układ bez przeciągania</span><b>Ułóż / menu pozycji</b><span>Cofnij / ponów zmianę mapy</span><b>Ctrl Z / Ctrl Shift Z</b><span>Ręczne przesuwanie</span><b>Strzałki · Shift: szybciej</b><span>Anuluj operację</span><b>Escape</b></div><div class="divider"></div><p>Przyciski nie wymagają skrótów. Menu pozycji pozwala wpisać współrzędne i przesuwać strzałkami ekranowymi. Zmiany są zapisywane w tej przeglądarce. Eksport danych znajdziesz przy swoim profilu.</p><div class="dialog-actions">${btn('Wracam do mapy','close-dialog','primary')}</div>`,'Sterowanie mapą')}
function positionMenu(anchor){let ns=selected(),n=ns[0];if(!n)return;openPop(`<div class="pop-label">Przesuń zaznaczenie</div><div class="poprow">${ib('up','nudge','Przesuń w górę','',`data-dx="0" data-dy="-24"`)}</div><div class="poprow">${ib('left','nudge','Przesuń w lewo','',`data-dx="-24" data-dy="0"`)}${ib('down','nudge','Przesuń w dół','',`data-dx="0" data-dy="24"`)}${ib('right','nudge','Przesuń w prawo','',`data-dx="24" data-dy="0"`)}</div><form data-form="position" style="padding:9px"><div class="row"><label class="small">X <input name="x" type="number" value="${Math.round(n.x)}" style="width:86px" required></label><label class="small">Y <input name="y" type="number" value="${Math.round(n.y)}" style="width:86px" required></label></div><button class="btn full" style="margin-top:12px">Ustaw pozycję</button></form>` ,anchor)}
function newProjectDialog(sourceId=null){const source=sourceId?scope().threads.find(t=>t.id===sourceId):null;openDialog(`<div class="row"><span class="eyebrow">Niezależny projekt</span><span class="grow"></span>${ib('x','close-dialog','Zamknij','flat')}</div><h2>Z kim to robisz?</h2><p>${source?'Projekt z tej rozmowy zaczyna się w tym samym gronie. Przeniesiemy wybraną wypowiedź z odpowiedziami, nie cały DM.':'Nie dziedziczy ludzi z innych projektów. Wybierz swój skład.'}</p><form data-form="project" data-source="${sourceId||''}"><label class="field-label" for="project-name">Nazwa robocza</label><input id="project-name" name="name" class="full" placeholder="Np. mały robot od kawy" autofocus required>${(source?scope().members:['h','m','o','k']).map(x=>`<div class="member"><label>${av(x)}<span>${names[x]}</span><input name="member" value="${x}" type="checkbox" ${x==='h'||x==='m'?'checked':''} ${x==='h'||source?'disabled':''}></label></div>`).join('')}${source?`<div class="result-card"><span class="eyebrow">Wybrana wypowiedź</span><p>${esc(source.text)}</p></div>`:''}<div class="dialog-actions">${btn('Anuluj','close-dialog','flat')}<button class="btn primary">Utwórz projekt</button></div></form>`,'Nowy projekt')}
function changeTaskState(id,value){let t=scope().tasks.find(t=>t.id===id);if(!t||!statusLabels[value])return;t.state=value;persist();if(S.view==='tasks'){const keep=panel;$('#content').innerHTML=boardHTML();panel=keep;if(panel)renderPanel()}else if(panel)renderPanel();renderHeader();toast('Stan zadania: '+statusLabels[value]+'. Mapa nie zmieniła znaczenia.');restoreDrafts()}
function focusNode(id){let s=scope(),m=s.maps.find(m=>m.nodes.some(n=>n.id===id));if(!m)return toast('Ten fragment usunięto z mapy.');const keep=panel;s.mapId=m.id;S.view='map';panel=null;render();selection=new Set([id]);updateSelection();ensureVisible(node(id));if(keep&&keep.type==='task'){panel=keep;renderPanel()}}
function importListDialog(){openDialog(`<div class="row"><span class="eyebrow">Szybciej niż dodawanie po jednej</span><span class="grow"></span>${ib('x','close-dialog','Zamknij','flat')}</div><h2>Wklej myśli. Powstaną gałęzie.</h2><p>Każdy wiersz to myśl. Wcięcie oznacza połączenie z wierszem wyżej. Nie tworzymy żadnych zadań.</p><form data-form="import-list"><textarea name="text" autofocus aria-label="Lista myśli" placeholder="Sterowanie lampką&#10;  Czujnik&#10;    Zasięg&#10;  Kamera&#10;    Oświetlenie" required></textarea><div class="dialog-actions">${btn('Anuluj','close-dialog','flat')}<button class="btn primary">Dodaj do mapy</button></div></form>`,'Wklej listę myśli')}
function addOutline(text){let lines=text.split('\n').filter(l=>l.trim()).slice(0,100);if(!lines.length)return;remember();let b=bounds(map().nodes),startX=map().nodes.length?b.x+b.w+150:60,startY=80,stack=[],added=[];for(let line of lines){let spaces=(line.match(/^\s*/)?.[0]||'').replace(/\t/g,'  ').length;while(stack.length&&stack.at(-1).indent>=spaces)stack.pop();let p=stack.at(-1)?.n,n={id:uid('n'),x:startX+(stack.length)*320,y:startY+added.length*135,w:220,h:100,title:line.trim().replace(/^[-*]\s+/,''),type:!p?'root':'card',parent:p?.id||null};map().nodes.push(n);if(p)map().edges.push({id:uid('e'),from:p.id,to:n.id,kind:'branch'});stack.push({indent:spaces,n});added.push(n)}selection=new Set(added.map(n=>n.id));renderMap();arrange('tree');toast('Dodano '+added.length+' myśli — bez tworzenia zadań.');persist()}
function exportData(){finishEdit();const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='flux-studio-v8-dane.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);closePop()}
function validDataBase(o){const safeId=v=>typeof v==='string'&&/^[a-zA-Z0-9_-]{1,100}$/.test(v),person=v=>Object.hasOwn(names,v);if(!o||o.version!==4||!o.scopes||!o.scopes[o.scope]||!['map','talk','tasks','wiki','home'].includes(o.view)||!o.drafts||!Array.isArray(o.captures))return false;let scopes=Object.values(o.scopes);if(scopes.length>100)return false;return scopes.every(s=>safeId(s.id)&&['project','dm','private'].includes(s.kind)&&typeof s.name==='string'&&Array.isArray(s.members)&&s.members.every(person)&&Array.isArray(s.maps)&&s.maps.length<=50&&s.maps.every(m=>safeId(m.id)&&typeof m.name==='string'&&Array.isArray(m.nodes)&&m.nodes.length<=3000&&m.nodes.every(n=>safeId(n.id)&&(!n.parent||safeId(n.parent))&&['root','card','note','pill'].includes(n.type)&&typeof n.title==='string'&&['x','y','w','h'].every(k=>Number.isFinite(n[k])&&Math.abs(n[k])<1e6))&&Array.isArray(m.edges)&&m.edges.every(e=>safeId(e.id)&&safeId(e.from)&&safeId(e.to))&&(!m.camera||['x','y','z'].every(k=>Number.isFinite(m.camera[k]))))&&Array.isArray(s.tasks)&&s.tasks.every(t=>safeId(t.id)&&typeof t.title==='string'&&Array.isArray(t.anchors)&&t.anchors.every(safeId)&&(!t.owner||person(t.owner))&&Object.hasOwn(statusLabels,t.state))&&Array.isArray(s.threads)&&s.threads.every(t=>safeId(t.id)&&person(t.author)&&typeof t.text==='string'&&Array.isArray(t.replies)&&t.replies.every(r=>safeId(r.id)&&person(r.author)&&typeof r.text==='string')&&Array.isArray(t.anchors)&&t.anchors.every(safeId)&&Array.isArray(t.taskIds)&&t.taskIds.every(safeId))&&Array.isArray(s.agent)&&s.agent.every(a=>safeId(a.id)&&safeId(a.taskId)&&typeof a.text==='string'&&Array.isArray(a.anchors)&&a.anchors.every(safeId)))}
function importData(){closePop();let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{let f=input.files[0];if(!f)return;if(f.size>8e6)return toast('Plik jest za duży. Limit prototypu: 8 MB.');try{let data=JSON.parse(await f.text());if(!validData(data))throw Error('format');openDialog(`<h2>Wczytać zapis?</h2><p>Zastąpi obecne dane prototypu w tej przeglądarce. Przed importem możesz wyeksportować swój obecny szkic.</p><div class="dialog-actions">${btn('Anuluj','close-dialog','flat')}${btn('Eksportuj obecne','export')}${btn('Wczytaj','confirm-import','primary')}</div>`,'Wczytaj dane');window.pendingImport=data}catch{toast('To nie jest poprawny zapis tego prototypu.')}};input.click()}
function helpInfo(){openDialog(`<div class="row"><span class="eyebrow">Lokalny prototyp interakcji</span><span class="grow"></span>${ib('x','close-dialog','Zamknij','flat')}</div><h2>Co działa, a co jest demonstracją?</h2><p>Działa: przeciąganie i wielokrotne zaznaczanie myśli, przesuwanie płótna, zoom, połączenia, edycja, układy, cofanie, zapis lokalny, komentarze, zadania, przenoszenie kart, prywatne rozmowy i niezależne składy projektów w danych demonstracyjnych.</p><div class="gap"></div><p>AI to jawnie oznaczone reguły demonstracyjne. Nie ma prawdziwej współpracy na żywo, SSO, kontroli dostępu serwera, Git/CI ani modelu AI. To nie jest zamiennik pełnego edytora przy tysiącach elementów. Import v2/v3 nie jest obsługiwany.</p><div class="gap"></div><p>Dane zapisują się w tej przeglądarce. Zmiana nazwy lub miejsca pliku może zmienić zachowanie zapisu lokalnego. Korzystaj z eksportu JSON. Prototyp nie wysyła danych do internetu.</p><div class="dialog-actions">${btn('Zamknij','close-dialog','primary')}</div>`,'O prototypie')}
async function act(a,el){
 const id=el?.dataset.id;

 case 'nudge':{let dx=Number(el.dataset.dx),dy=Number(el.dataset.dy);remember();selected().filter(n=>!n.locked).forEach(n=>{n.x+=dx;n.y+=dy});renderMap();persist();break}
 case 'move-click':closePop();moveTarget=true;updateSelection();break;
 case 'connect':closePop();if(selection.size===1){connectFrom=[...selection][0];updateSelection()}break;

 case 'shape':mutate(()=>selected().forEach(n=>{n.type=el.dataset.type;n.h=nodeHeight(n)}),'Zmieniono wygląd myśli.');closePop();break;
 case 'delete-nodes':deleteNodes();break;
 case 'delete-edge':mutate(()=>{let e=map().edges.find(x=>x.id===selectedEdge);if(e?.kind==='branch'&&node(e.to)?.parent===e.from)node(e.to).parent=null;map().edges=map().edges.filter(x=>x.id!==selectedEdge);selectedEdge=null},'Usunięto połączenie. Myśli zostały.');break;
 case 'undo':undo();break;
 case 'redo':redo();break;
 case 'zoom-in':zoom(cam().z*1.2);break;

 case 'zoom-reset':zoom(1);break;
 case 'fit':fit();break;
 case 'view-move-menu':openPop(`<div class="pop-label">Przesuń widok</div><div class="poprow">${ib('up','pan-step','Widok w górę','',`data-dx="0" data-dy="100"`)}</div><div class="poprow">${ib('left','pan-step','Widok w lewo','',`data-dx="100" data-dy="0"`)}${ib('down','pan-step','Widok w dół','',`data-dx="0" data-dy="-100"`)}${ib('right','pan-step','Widok w prawo','',`data-dx="-100" data-dy="0"`)}</div>`,el);break;
 case 'pan-step':cam().x+=Number(el.dataset.dx);cam().y+=Number(el.dataset.dy);updateCamera();break;
 case 'list-toggle':finishEdit();listMode=!listMode;renderMapShell();if(!listMode&&innerWidth<600){const target=selected()[0]||map().nodes.find(n=>n.type==='root')||map().nodes[0];if(target)fit([target.id])}break;
 case 'layout-menu':openPop(`<div class="pop-label">${selection.size>1?'Tylko zaznaczenie':'Cała mapa'}</div>${popItem('layout','Ułóż gałęzie','arrange','data-kind="tree"')}${popItem('grid','Ułóż w siatce','arrange','data-kind="grid"')}${popItem('arrow','Ułóż w rzędzie','arrange','data-kind="row"')}${popItem('list','Ułóż w kolumnie','arrange','data-kind="column"')}<div class="popdesc">Pozycje zmienią się dopiero po kliknięciu. Zablokowane myśli zostają na miejscu. Możesz cofnąć układ.</div>`,el);break;

 case 'switch-map':finishEdit();scope().mapId=id;selection.clear();selectedEdge=null;panel=null;render();break;
 case 'new-map':openDialog(`<h2>Nowa mapa</h2><p>W tym samym projekcie, z tymi samymi osobami. Bez nowej konfiguracji.</p><form data-form="new-map"><label class="field-label" for="map-name">Nazwa</label><input name="name" id="map-name" class="full" placeholder="Co rozrysowujemy?" required autofocus><div class="dialog-actions">${btn('Anuluj','close-dialog','flat')}<button class="btn primary">Otwórz mapę</button></div></form>`,'Nowa mapa');break;

 case 'task-anchor-picker':{let t=scope().tasks.find(t=>t.id===id);openDialog(`<h2>Powiąż myśli z zadaniem</h2><p>To powiązanie kontekstu — myśl nie stanie się zadaniem.</p><form data-form="task-anchors" data-id="${id}">${scope().maps.map(m=>`<div class="eyebrow" style="margin:19px 0 8px">${esc(m.name)}</div>${m.nodes.map(n=>`<div class="member"><label><span>${esc(n.title)}</span><input type="checkbox" name="anchor" value="${n.id}" ${t.anchors.includes(n.id)?'checked':''}></label></div>`).join('')}`).join('')}<div class="dialog-actions">${btn('Anuluj','close-dialog','flat')}<button class="btn primary">Zapisz powiązania</button></div></form>`,'Powiązane myśli');break}
 case 'thread-to-map':{let t=scope().threads.find(t=>t.id===id);panel=null;S.view='map';ensureMap();render();let existing=map().nodes.find(n=>n.sourceThreadId===id);if(existing){selectOnly(existing.id);ensureVisible(existing);break}let n=addNode(null,null,'note',t.text);n.sourceThreadId=t.id;n.label='Z ROZMOWY';t.anchors.push(n.id);renderMap();persist();toast('Wypowiedź jest na mapie. Odpowiedzi zostały przy jej źródle.');break}

function v6ApplyRun(id){const f=v6FindRun(id);if(!f)return;const {s,r}=f;if(r.state!=='proposed')return;if(!s.members.includes(r.requestedBy)){r.state='failed';r.text='Brak aktualnego dostępu.';return}const p=r.proposal;let changed=false;

 if(a==='v8-attach-material'&&task){if(!v5Shared(key,S.scope))return toast('Odbiorcy nie mają dostępu.');if(!task.materialRefs.includes(key))task.materialRefs.push(key);closeDialog();persist();v6Refresh();toast('Dodano źródło do zadania. Wiki pokazuje, gdzie jest używane.');return;}
 if(a==='v8-wiki-map'){closePanel();v7ReferenceNode(key);return;}
 if(a==='v8-wiki-comment'){const o=v8Meta(key),existing=scope().threads.find(t=>o?.type==='fragment'?(t.fragmentKeys||[]).includes(key):(t.pageIds||[]).includes(o?.id));if(existing)return v8OpenThread(S.scope,existing.id);return v8NewThreadDialog(key);}
 if(a==='v8-quote-comment'){const selection=V6.selectionQuote;if(!selection)return;const k=v6MakeFragment(selection);if(k){$('#v6-quote-tools')?.remove();getSelection()?.removeAllRanges();v8NewThreadDialog(k);}return;}
 if(a==='v8-wiki-source'){const o=v8Meta(key);if(!o)return;const f=o.type==='fragment'?scope().fragments.find(f=>f.id===o.id):null,pid=f?.pageId||o.id;v8SaveDrafts();const r=V8.returnTo;V8.base.navigate(o.sid,'wiki');scope().pageId=pid;V5.editPage=null;render();V8.returnTo=r;if(f)requestAnimationFrame(()=>{const status=v6FragmentStatus(scope(),f);if(status.ok){const root=$('.v5-page-sheet>.v5-md');v6Highlight(root,f.quote,status.position??status.pos??null);root?.querySelector('mark')?.scrollIntoView({block:'center'});}else toast('Źródło się zmieniło. Otworzono stronę, nie inne zdanie.');});return;}
 if(a==='v8-info'){openDialog('<h2>Flux Studio v8</h2><p>Rozmowy, mapa, zadania i wiki mają wspólny kontekst, ale osobną treść. Typ materiału i znaczenie połączenia są widoczne przed kliknięciem.</p><p>Jedno miejsce pisania przy zadaniu: wiadomość, przeszkoda lub wynik. Wszystkie pozostają w tej samej rozmowie.</p><p><strong>Prototyp lokalny.</strong> AI jest symulowane. Brak prawdziwych kont, współpracy na żywo, MCP i integracji. Nie wpisuj tajnych danych.</p><div class="dialog-actions">'+btn('Zamknij','close-dialog','primary')+'</div>','Informacje');}
}
window.addEventListener('click',e=>{const ref=e.target.closest?.('[data-v5-ref]');if(ref&&!ref.closest('[contenteditable="true"]')){e.preventDefault();e.stopImmediatePropagation();v8Open(ref.dataset.v5Ref);return;}const b=e.target.closest?.('[data-act]');if(!b)return;const a=b.dataset.act;if(!a.startsWith('v8-'))return;e.preventDefault();e.stopImmediatePropagation();Promise.resolve(v8Action(a,b)).catch(err=>{console.error(err);toast('Nie udało się wykonać działania. Szkic zachowano.');});},true);
window.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.v8Send)return;e.preventDefault();e.stopImmediatePropagation();const ed=f.querySelector('.v5-rich-input');if(ed)v5Sync(ed);const fd=new FormData(f),text=String(fd.get('text')||'').trim();if(!text)return;if(!v5AllowedText(text,S.scope))return toast('Odnośnik spoza uprawnień odbiorców. Wiadomość nie została wysłana.');
 if(f.dataset.v8Send==='task'){const r=v8Publish({taskId:f.dataset.task,text,mode:f.dataset.v8Mode,helper:String(fd.get('helper')||''),finish:fd.get('finish')==='yes',threadId:f.dataset.v8Thread||null});if(!r.ok)return toast(r.error);const key=f.querySelector('[data-draft]')?.dataset.draft;if(key)delete S.drafts[key];if(ed){ed.innerHTML='';ed._source.value='';}V8.mode[S.scope+'/'+f.dataset.task]='message';V8.forceScroll=true;v6Refresh();toast(f.dataset.v8Mode==='blocker'?'Zadanie czeka · powód jest w rozmowie.':f.dataset.v8Mode==='result'?'Wynik przypięty · dostępny w zadaniu, rozmowie i przy mapie.':'Wysłano do tej samej rozmowy.');return;}
 if(f.dataset.v8Send==='new'){const key=f.dataset.v8Key||null,o=key&&v8Meta(key),th={id:uid('thread'),title:o?'Pytanie: '+o.title:undefined,author:'h',time:'teraz',createdAt:new Date().toISOString(),text,anchors:[],taskIds:[],pageIds:o?.type==='page'?[o.id]:[],fragmentKeys:o?.type==='fragment'?[key]:[],replies:[]};scope().threads.push(th);v6NotifyMessage(scope(),th,th);if(/^\/ai\s/.test(text))v6StartRun(S.scope,th.id,text.replace(/^\/ai\s*/,''));const dk=f.querySelector('[data-draft]')?.dataset.draft;if(dk)delete S.drafts[dk];if(ed){ed.innerHTML='';ed._source.value='';}closeDialog();v8OpenThread(S.scope,th.id);return;}
},true);
// Preserve new-thread focus for legacy composers (map, wiki, private message).
v6Post=function(f,text){const was=f.dataset.form==='reply',before=scope().threads.length;V8.base.v6Post(f,text);if(!was&&scope().threads.length>before){const th=scope().threads.at(-1);V8.active[S.scope]=th.id;S.v8.active=V8.active;persist();if(S.view==='talk')v6Refresh();}};
window.fluxV8Test={state:()=>clone(S),graph:sid=>clone(v8Graph(S.scopes[sid])),context:key=>clone(v8Context(key)),publish:options=>v8Publish(options),active:()=>v8CurrentThread()?.id};
/* A result is already visible from its map. Background AI must not propose a second copy. */
const v8SourcesBefore=v6Sources;
v6Sources=function(s,th,prompt){const keys=new Set(v8SourcesBefore(s,th,prompt));for(const c of v8Context(v8Key(s,'thread',th.id)).cards)if(c.key.startsWith(s.id+'/'))keys.add(c.key);return [...keys].filter(k=>v5Object(k)&&v5Shared(k,s.id));};
agentAfterResult=function(t){const s=scope();if(!s.settings.agentBackground||!t.resultMessageId||!t.result?.trim())return;const f=v7Message(s,t.resultMessageId);if(!f)return;const pages=new Set([...t.materialRefs||[],...v5Refs(t.description)].map(k=>v5Object(k)).filter(o=>o?.sid===s.id).map(o=>o.type==='page'?o.id:o.type==='fragment'&&o.kind==='page'?o.pageId:null).filter(Boolean));if(pages.size!==1)return;
 const eventKey='v8-wiki-result:'+t.id+':'+t.result.trim();if(s.runs.some(r=>r.eventKey===eventKey))return;const pageId=[...pages][0],prompt='Dopisz obserwację z wyniku '+v5MDRef(v8Key(s,'task',t.id))+' do wiki '+v5MDRef(v8Key(s,'page',pageId))+'. Nie zmieniaj wybranego rozwiązania.';
 const r=v6StartRun(s.id,f.t.id,prompt,'background');if(r){r.eventKey=eventKey;r.v8Evidence={taskId:t.id,messageId:t.resultMessageId,text:t.result};persist();}
};
const v8PrepareRunBefore=v6PrepareRun;
v6PrepareRun=function(s,th,r,eventTask){v8PrepareRunBefore(s,th,r,eventTask);if(r.v8Evidence&&r.proposal?.kind==='wiki')r.text='Wynik jest już dostępny przy mapie i zadaniu. Przygotowałem dopisanie obserwacji do powiązanej wiki. Nie zmieniam dotychczasowych ustaleń.';};
const v8ApplyRunBefore=v6ApplyRun;
v6ApplyRun=function(id){const f=v6FindRun(id);if(f?.r.state==='proposed'&&f.r.v8Evidence){const ev=f.r.v8Evidence,t=f.s.tasks.find(t=>t.id===ev.taskId);if(!t||t.resultMessageId!==ev.messageId||t.result!==ev.text){f.r.state='stale';f.r.text='Wynik zmienił się od przygotowania propozycji. Nie dopisuję nieaktualnego wyniku do wiki.';persist();v6Refresh();return;}}v8ApplyRunBefore(id);};
// Close a mobile material drawer when opening its destination, but keep the conversation draft.
const v8OpenBefore=v8Open;
v8Open=function(key){$('.v8-live-context')?.classList.remove('mobile-open');$('.v8-thread-list')?.classList.remove('mobile-open');v8OpenBefore(key);};
v5OpenPreview=v8Open;
// The old "refer in conversation" command targeted a feed composer. v8 targets the actual open thread.
v6QuoteToTalk=function(sel){const key=v6MakeFragment(sel);if(!key)return toast('Nie udało się zachować zaznaczenia. Zaznacz ponownie.');$('#v6-quote-tools')?.remove();getSelection()?.removeAllRanges();const s=S.scopes[sel.sid],th=s.threads.find(t=>t.id===V8.active[s.id])||s.threads[0];v8SaveDrafts();if(th)v8OpenThread(s.id,th.id);else v8NewThreadDialog();requestAnimationFrame(()=>{const ed=th?$('.v8-thread-composer .v5-rich-input'):$('.dialog .v5-rich-input');if(!ed)return;const old=v5Serialize(ed),value=old+(old?'\n':'')+v5MDRef(key)+' ';ed.innerHTML=v5Rich(value,true);v5Sync(ed);ed.focus();const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);getSelection().removeAllRanges();getSelection().addRange(r);});toast('Odnośnik w szkicu wybranej rozmowy. Niczego nie wysłano.');};
const v8MetaBefore=v8Meta;
v8Meta=function(key){const o=v8MetaBefore(key);if(o?.type==='fragment'&&o.kind==='node'){const s=S.scopes[o.sid],m=s.maps.find(m=>m.id===o.mapId),n=m?.nodes.find(n=>n.id===o.nodeId);return {...o,label:'Mapa · fragment myśli',icon:'map',title:n?.title||o.parentTitle||'Fragment myśli',trail:m?.name||'Mapa',excerpt:o.quote};}return o;};
const v8OpenNodeFragmentBefore=v8Open;
v8Open=function(key){const o=v8Meta(key);if(o?.type==='fragment'&&o.kind==='node'){v8SaveDrafts();v8RememberOrigin();S.scopes[o.sid].mapId=o.mapId;V8.base.navigate(o.sid,'map');selection=new Set([o.nodeId]);openPanel('context',{ids:[o.nodeId]});requestAnimationFrame(()=>fit([o.nodeId]));toast('Otworzono myśl zawierającą cytowany fragment.');return;}v8OpenNodeFragmentBefore(key);};
v5OpenPreview=v8Open;
// The canvas is already resized by the side panel in v8 CSS. Do not subtract it twice.
availableSize=function(){const v=$('#viewport');return {w:Math.max(200,v?.clientWidth||200),h:v?.clientHeight||200};};
const v8AgentNoticeBefore=renderAgentNotice;
renderAgentNotice=function(){if(panel||V8.returnTo){const el=$('#agent-notice');if(el)el.innerHTML='';return;}v8AgentNoticeBefore();};

// Same resized viewport rule when bringing a freshly added or edited thought into view.
ensureVisible=function(n){const v=$('#viewport'),c=cam();if(!v||!n)return;const right=v.clientWidth;if(n.x*c.z+c.x<45)c.x=45-n.x*c.z;if((n.x+n.w)*c.z+c.x>right-60)c.x=right-60-(n.x+n.w)*c.z;if(n.y*c.z+c.y<70)c.y=70-n.y*c.z;if((n.y+n.h)*c.z+c.y>v.clientHeight-100)c.y=v.clientHeight-100-(n.y+n.h)*c.z;updateCamera();};

if(!validData(S))S=seed();
v5Init();
v6Init();
v8Init();
render();
v5Upgrade();
persist();
</script>
